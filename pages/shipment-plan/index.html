<!doctype html>
<!-- 发货计划查询区域原型 v1.1.0 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>发货计划｜查询区域交互原型</title>
  <link rel="stylesheet" href="./styles.css?v=1.7.23">
  <link rel="stylesheet" href="../../global-export.css?v=1.0.0">
</head>
<body>
  <div class="toast" id="toast">查询完成</div>
  <div class="app">
    <header class="global-bar">
      <div class="global-left"><span class="brand-shield"></span><span class="top-icon">▣</span><span class="top-icon">◉</span><span class="top-icon active">⛓</span><span class="top-icon">▥</span><span class="top-icon">▤</span><span class="top-icon">▧</span></div>
      <div class="global-right"><span class="icon">⟳</span><span class="icon">⛶</span><span class="admin">Admin⌄</span></div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div class="nav-scroll">
          <div class="nav-group-title"><span>♙</span><span>库存管理</span><span class="chev">⌃</span></div>
          <div class="nav-item"><span class="mini">▤</span>团队库存</div><div class="nav-item"><span class="mini">▥</span>平台仓&海外仓</div><div class="nav-item" data-page-nav="supplierInventory"><span class="mini">▱</span>供应商库存</div>
          <div class="nav-group-title"><span>♧</span><span>计划管理</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="forecast"><span class="mini">▣</span>需求预测</div><div class="nav-item" data-page-nav="stock"><span class="mini">▤</span>备货计划</div><div class="nav-item" data-page-nav="purchase"><span class="mini">▥</span>采购计划</div><div class="nav-item active" data-page-nav="shipment"><span class="mini">♨</span>发货计划</div>
          <div class="nav-group-title"><span>▱</span><span>供应链协同</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="purchaseOrder"><span class="mini">▰</span>采购单</div><div class="nav-item" data-page-nav="shipmentOrder"><span class="mini">▤</span>发货单</div><div class="nav-item" data-page-nav="skuFirstLegCost"><span class="mini">¥</span>头程费用</div>
        </div><div class="collapse">≡</div>
      </aside>
      <main class="main">
        <section class="page-head"><div class="page-tab"><span>♨</span><span>发货计划</span></div></section>
        <section class="query-panel" aria-label="新增查询区域">
          <div class="query-row" id="queryRowOne">
            <div class="query-item code-query" data-query-order="1"><select class="control code-type" id="codeType" title="编码类型"><option>SKU</option><option>供应商料号</option><option>领星 SKU</option><option>SellerSKU</option><option>FNSKU</option><option>ASIN</option></select><div class="control tag-input code-box" id="codeBox"><div id="codeTags"></div><input id="codeInput" placeholder="请输入编码，支持多个，用逗号、空格或换行隔开" autocomplete="off"></div></div>
            <div class="query-item" data-query-order="2"><input class="control plan-input" id="planNo" placeholder="请输入计划号，支持多个，用逗号或空格隔开"></div>
            <div class="query-item" data-query-order="3"><div class="multi compact-box" id="shipWarehouseMulti"><div class="multi-trigger" data-trigger>发货仓（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="4"><div class="multi compact-box" id="destinationWarehouseMulti"><div class="multi-trigger" data-trigger>目的地仓（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="5"><div class="multi compact-box" id="destinationTypeMulti"><div class="multi-trigger" data-trigger>目的地仓类型（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="6"><div class="multi compact-box" id="firstMileMulti"><div class="multi-trigger" data-trigger>头程物流商（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="7"><div class="multi compact-box" id="channelMulti"><div class="multi-trigger" data-trigger>物流渠道（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="8"><div class="multi compact-box" id="transportMulti"><div class="multi-trigger" data-trigger>运输方式（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="9"><div class="multi platform-box" id="platformMulti"><div class="multi-trigger" data-trigger>平台（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="10"><div class="multi country-box" id="countryMulti"><div class="multi-trigger" data-trigger>国家（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="11"><div class="multi store-box" id="storeMulti"><div class="multi-trigger" data-trigger>店铺（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="12"><div class="multi team-box" id="teamMulti"><div class="multi-trigger" data-trigger>团队（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item time-query" data-query-order="13"><select class="control time-type" id="timeType"><option>创建时间</option><option>更新时间</option><option>预计发货日期</option><option>预计到货日期</option></select><div class="date-group"><input id="startDate" type="date" aria-label="开始日期"><span>至</span><input id="endDate" type="date" aria-label="结束日期"></div></div>
            <div class="query-item" data-query-order="14"><div class="multi creator-box" id="creatorMulti"><div class="multi-trigger" data-trigger>创建人（可多选）</div><div class="dropdown" data-menu></div></div></div>
          </div>
          <div class="query-row" id="queryRowTwo"><div class="query-actions"><button class="btn primary" id="searchBtn">查询</button><button class="btn" id="resetBtn">重置</button></div></div>
          <div class="query-row advanced-query-row">
            <div class="query-item" data-query-order="15"><input class="control remark-input" id="remark" placeholder="发货计划备注，支持模糊查询"></div>
            <div class="query-item" data-query-order="16"><input class="control order-input" id="purchaseNo" placeholder="采购单号，多个请用逗号或空格隔开"></div>
            <div class="query-item" data-query-order="17"><input class="control order-input" id="shippingOrderNo" placeholder="发货单号，多个请用逗号或空格隔开"></div>
            <div class="query-item" data-query-order="18"><input class="control order-input" id="shipmentNo" placeholder="货件单号，多个请用逗号或空格隔开"></div>
          </div>
          <button class="query-expand" id="queryExpand" type="button"><span class="query-arrow">⌄</span><span class="query-expand-text">展开</span></button>
        </section>
        <section class="action-strip"><div class="head-actions"><button class="btn primary">新建发货计划</button><button class="btn primary badge-button">发货计划管理清单<span class="badge">4</span></button></div></section>
        <section class="status-bar"><div class="status-tabs" id="statusTabs"></div><div class="status-tools"><label class="compare"><input id="compareToggle" type="checkbox" checked>显示销量环比</label><span class="tool" title="筛选">▽</span><span class="tool" title="搜索">⌕</span><span class="tool" title="设置">⚙</span><span class="tool" title="刷新" id="refreshBtn">↻</span><span class="tool" title="上传">↥</span><span class="tool" title="下载">↧</span><span class="tool" title="文档">▧</span></div></section>
        <section class="table-area" id="tableArea"><table class="stock-table"><thead><tr><th class="check"><input class="head-check" id="selectAll" type="checkbox"></th><th class="plan">计划号</th><th class="sku">SKU</th><th class="status-col">状态</th><th class="updated-col">更新时间</th><th class="creator-col">创建人</th><th class="remark-col">发货计划备注&nbsp; ✎</th><th class="delivery-col">预计发货日期&nbsp; ✎</th><th class="delivery-col">预计到货日期&nbsp; ✎</th><th class="box-col">箱数</th></tr></thead><tbody id="tableBody"></tbody></table></section>
        <footer class="bottom-bar"><div class="bottom-left"><span class="selected-count">已选 <b id="selectedCount">0</b> 条结果</span><button class="btn soft">确认</button><button class="btn soft">加入计划管理清单</button><button class="btn soft">生成发货单</button><button class="btn soft">作废</button></div><div class="bottom-right"><span>共 <b id="totalCount">62</b> 条</span><select class="control page-size" id="pageSize"><option value="15">15条/页</option><option value="30">30条/页</option><option value="50">50条/页</option></select><button class="page-btn" id="prevPage">‹</button><span id="pageButtons"></span><button class="page-btn" id="nextPage">›</button><span>前往</span><input class="control jump" id="jumpPage" value="1"><span>页</span></div></footer>
      </main>
    </div>
  </div>
  <script src="./app.js?v=1.7.23"></script>
  <script src="../../global-export.js?v=1.0.0"></script>
</body>
</html>
