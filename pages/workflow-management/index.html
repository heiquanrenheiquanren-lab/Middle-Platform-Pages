<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>流程管理</title>
  <link rel="stylesheet" href="../transfer-orders/styles.css?v=1.0.24">
  <link rel="stylesheet" href="../../navigation.css?v=1.7.92">
  <link rel="stylesheet" href="./styles.css?v=1.0.0">
</head>
<body data-ui-kit-page="standard" class="ui-page-canvas">
<div class="app"><header class="global-bar"><div class="global-left"><span class="brand-shield"></span><button class="top-icon">工作台</button><button class="top-icon active" data-module="basic">基础</button><button class="top-icon">财务</button><button class="top-icon">供应链</button><button class="top-icon">运营</button><button class="top-icon">产品</button></div><div class="global-right"><span class="admin">Admin⌄</span></div></header>
<div class="shell"><aside class="sidebar"><div class="nav-scroll"><div class="nav-group-title"><span>♙</span><span>权限管理</span><span class="chev">⌃</span></div><div class="nav-item">账号管理</div><div class="nav-item">部门管理</div><div class="nav-item" data-page-nav="roleManagement">角色管理</div><div class="nav-item">菜单管理</div><div class="nav-item active" data-page-nav="workflowManagement">流程管理</div><div class="nav-item">系统日志</div><div class="nav-group-title"><span>⚙</span><span>基础配置</span><span class="chev">⌃</span></div><div class="nav-item">平台管理</div><div class="nav-item">团队管理</div><div class="nav-item" data-page-nav="warehouseSku">仓库管理</div><div class="nav-item">国家管理</div><div class="nav-item">站点管理</div></div><div class="collapse">≡</div></aside>
<main class="main workflow-main"><section class="workflow-query ui-query-card"><div class="ui-query-flow"><input id="keyword" class="control" placeholder="流程名称"><select id="docType" class="control"><option value="">业务单据（全部）</option><option>采购单</option><option>发货单</option><option>调拨单</option><option>损益单</option></select><select id="status" class="control"><option value="">流程状态（全部）</option><option>已启用</option><option>草稿</option><option>已停用</option></select><div class="ui-query-actions"><button id="searchBtn" class="ui-query-button ui-query-button--primary">查询</button><button id="resetBtn" class="ui-query-button">重置</button></div></div></section>
<div class="ui-action-row workflow-actions"><button id="newBtn" class="ui-list-action-button ui-list-action-button--primary">新增审批流</button><span class="action-tip">审批流决定单据当前轮到谁审核；角色权限仅决定审核资格</span></div>
<section class="workflow-list ui-list-card"><div class="ui-table-wrap"><table class="ui-table workflow-table"><thead><tr><th>流程名称</th><th>业务单据</th><th>适用条件</th><th>审批步骤</th><th>版本</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="tableBody"></tbody></table><div id="empty" class="empty-state" hidden>暂无符合条件的审批流</div></div><footer class="table-footer"><span id="totalCount">共 0 条</span><div><button>‹</button><button class="active">1</button><button>›</button></div></footer></section></main></div></div>
<div id="editorMask" class="ui-dialog-mask" hidden><section class="ui-dialog workflow-editor" role="dialog" aria-modal="true"><header class="ui-dialog__header"><div><h2 id="editorTitle">新增审批流</h2><span>按顺序配置审批节点，前一节点通过后才会激活下一节点</span></div><button class="ui-dialog__close" data-close-editor>×</button></header><div class="ui-dialog__body editor-body"><section class="editor-card"><h3>基本信息</h3><div class="ui-form-grid"><label class="ui-field"><span class="ui-field__label"><em class="ui-field__required">*</em>流程名称</span><input id="flowName" placeholder="请输入流程名称"></label><label class="ui-field"><span class="ui-field__label"><em class="ui-field__required">*</em>业务单据</span><select id="flowDocType"><option>采购单</option><option>发货单</option><option>调拨单</option><option>损益单</option></select></label><label class="ui-field ui-field--wide"><span class="ui-field__label">流程说明</span><input id="flowDescription" placeholder="请输入流程说明"></label></div></section>
<section class="editor-card"><h3>适用条件</h3><div class="condition-row"><select id="conditionField"><option>全部单据</option><option>采购金额</option><option>采购团队</option><option>供应商等级</option></select><select id="conditionOperator"><option>无需判断</option><option>大于等于</option><option>等于</option><option>属于</option></select><input id="conditionValue" placeholder="条件值；全部单据时无需填写"></div><p class="helper">流程按优先级匹配，命中后只启动一条审批流。</p></section>
<section class="editor-card steps-card"><div class="section-head"><div><h3>审批步骤</h3><p>同一人默认不能连续审批多个节点</p></div><button id="addStepBtn" class="ui-list-action-button">＋ 添加审批步骤</button></div><div id="steps" class="steps"></div></section><p id="editorError" class="form-error"></p></div><footer class="ui-dialog__footer"><button class="ui-button" data-close-editor>取消</button><button id="saveDraftBtn" class="ui-button">保存草稿</button><button id="enableBtn" class="ui-button ui-button--primary">保存并启用</button></footer></section></div>
<div id="instanceMask" class="ui-dialog-mask" hidden><section class="ui-dialog instance-dialog" role="dialog" aria-modal="true"><header class="ui-dialog__header"><div><h2>流程实例</h2><span id="instanceSubtitle">查看单据的实际审批进度</span></div><button class="ui-dialog__close" data-close-instance>×</button></header><div class="ui-dialog__body"><div id="instanceSummary" class="instance-summary"></div><div id="instanceTimeline" class="instance-timeline"></div></div><footer class="ui-dialog__footer"><button class="ui-button ui-button--primary" data-close-instance>关闭</button></footer></section></div>
<div id="toast" class="toast"></div><script src="./app.js?v=1.0.0"></script><script src="../../navigation.js?v=1.7.92"></script>
</body></html>
