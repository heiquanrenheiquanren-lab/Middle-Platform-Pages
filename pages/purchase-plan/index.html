<!doctype html>
<!-- 采购计划原型 v1.7.0 对齐备货计划UI规范 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>采购计划｜供应链中台</title>
  <link rel="stylesheet" href="../../vendor/element-plus.css?v=1.7.0">
  <link rel="stylesheet" href="./styles.css?v=1.7.0">
</head>
<body>
  <div class="toast" id="toast">查询完成</div>
  <div class="app">
    <header class="global-bar">
      <div class="global-left"><span class="brand-shield"></span><span class="top-icon">▣</span><span class="top-icon">◉</span><span class="top-icon active">⛓</span><span class="top-icon">▥</span><span class="top-icon">▤</span><span class="top-icon">▧</span></div>
      <div class="global-right"><span class="icon">⟳</span><span class="icon">⛶</span><span class="admin">Admin⌄</span></div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div class="nav-scroll">
          <div class="nav-group-title"><span>♙</span><span>库存管理</span><span class="chev">⌃</span></div>
          <div class="nav-item"><span class="mini">▤</span>团队库存</div><div class="nav-item"><span class="mini">▥</span>平台仓&海外仓</div><div class="nav-item" data-page-nav="supplierInventory"><span class="mini">▱</span>供应商库存</div>
          <div class="nav-group-title"><span>♧</span><span>计划管理</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="forecast"><span class="mini">▣</span>需求预测</div><div class="nav-item" data-page-nav="stock"><span class="mini">▤</span>备货计划</div><div class="nav-item active" data-page-nav="purchase"><span class="mini">▥</span>采购计划</div><div class="nav-item" data-page-nav="shipment"><span class="mini">♨</span>发货计划</div>
          <div class="nav-group-title"><span>▱</span><span>供应链协同</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="purchaseOrder"><span class="mini">▰</span>采购单</div><div class="nav-item" data-page-nav="shipmentOrder"><span class="mini">▤</span>发货单</div>
        </div><div class="collapse">≡</div>
      </aside>
      <main class="main">
        <section class="page-head"><div class="page-tab"><span>▦</span><span>采购计划</span></div></section>
        <section class="query-panel" aria-label="查询区域">
          <div class="query-row">
            <select class="control code-type" id="codeType" title="编码类型"><option>SKU</option><option>供应商料号</option><option>领星 SKU</option><option>SellerSKU</option><option>FNSKU</option><option>ASIN</option></select>
            <div class="control tag-input code-box" id="codeBox"><div id="codeTags"></div><input id="codeInput" placeholder="请输入编码，支持多个，用逗号或空格隔开" autocomplete="off"></div>
            <input class="control plan-input" id="planNo" placeholder="请输入计划号，支持多个，用逗号或空格隔开">
            <div class="multi warehouse-box" id="warehouseMulti"><div class="multi-trigger" data-trigger>采购仓（可多选）</div><div class="dropdown" data-menu></div></div>
            <div class="multi supplier-box" id="supplierMulti"><div class="multi-trigger" data-trigger>供应商（可多选）</div><div class="dropdown" data-menu></div></div>
            <input class="control name-input" id="productName" placeholder="品名，支持模糊查询">
            <div class="multi platform-box" id="platformMulti"><div class="multi-trigger" data-trigger>平台（可多选）</div><div class="dropdown" data-menu></div></div>
            <div class="multi country-box" id="countryMulti"><div class="multi-trigger" data-trigger>国家（可多选）</div><div class="dropdown" data-menu></div></div>
            <div class="multi store-box" id="storeMulti"><div class="multi-trigger" data-trigger>店铺（可多选）</div><div class="dropdown" data-menu></div></div>
          </div>
          <div class="query-row">
            <div class="multi team-box" id="teamMulti"><div class="multi-trigger" data-trigger>团队（可多选）</div><div class="dropdown" data-menu></div></div>
            <select class="control time-type" id="timeType"><option>创建时间</option><option>更新时间</option><option>计划交货日期</option><option>计划下单日期</option></select>
            <div class="date-group"><input id="startDate" type="date" aria-label="开始日期"><span>至</span><input id="endDate" type="date" aria-label="结束日期"></div>
            <div class="multi creator-box" id="creatorMulti"><div class="multi-trigger" data-trigger>创建人（可多选）</div><div class="dropdown" data-menu></div></div>
            <div class="query-actions"><button class="btn primary" id="searchBtn">查询</button><button class="btn" id="resetBtn">重置</button></div>
          </div>
          <div class="query-row advanced-query-row">
            <input class="control order-input" id="purchaseNo" placeholder="采购单号，多个请用逗号或空格隔开">
            <input class="control order-input" id="shipmentNo" placeholder="发货单号，多个请用逗号或空格隔开">
            <input class="control remark-input" id="remark" placeholder="采购计划备注，支持模糊查询">
          </div>
          <button class="query-expand" id="queryExpand" type="button"><span class="query-arrow">⌄</span><span class="query-expand-text">展开</span></button>
        </section>
        <section id="purchaseBusinessApp" class="stock-business"></section>
      </main>
    </div>
  </div>
  <script src="../../vendor/vue.global.prod.js?v=1.7.0"></script>
  <script src="../../vendor/element-plus.js?v=1.7.0"></script>
  <script src="./app.js?v=1.7.0"></script>
</body>
</html>
