<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>提货单</title>
  <link rel="stylesheet" href="../transfer-orders/styles.css?v=1.0.25">
  <link rel="stylesheet" href="../../document-list.css?v=1.0.1">
  <link rel="stylesheet" href="../../navigation.css?v=1.7.99">
  <link rel="stylesheet" href="../../custom-select.css?v=1.0.0">
  <link rel="stylesheet" href="../../ui-kit.css?v=1.0.0">
  <link rel="stylesheet" href="./styles.css?v=2.3.0">
</head>
<body data-ui-kit-page="standard" class="ui-page-canvas">
  <div class="app">
    <header class="global-bar">
      <div class="global-left"><span class="brand-shield"></span><button class="top-icon">工作台</button><button class="top-icon" data-module="basic">基础</button><button class="top-icon">财务</button><button class="top-icon active">供应链</button><button class="top-icon">运营</button><button class="top-icon">产品</button></div>
      <div class="global-right"><span class="admin">Admin⌄</span></div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div class="nav-scroll">
          <div class="nav-group-title"><span>♙</span><span>库存管理</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="inventoryQuery">库存查询</div>
          <div class="nav-item" data-page-nav="processingOrder">加工单</div>
          <div class="nav-item" data-page-nav="transferOrder">调拨单</div>
          <div class="nav-item" data-page-nav="inventoryAdjustment">损益单</div>
          <div class="nav-item active" data-page-nav="pickupOrder">提货单</div>
          <div class="nav-group-title"><span>♧</span><span>计划管理</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="forecast">需求预测</div><div class="nav-item" data-page-nav="stock">备货计划</div><div class="nav-item" data-page-nav="purchase">采购计划</div><div class="nav-item" data-page-nav="shipment">发货计划</div>
          <div class="nav-group-title"><span>▱</span><span>供应链协同</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="purchaseOrder">采购单</div><div class="nav-item" data-page-nav="shipmentOrder">发货单</div></div>
        <div class="collapse">≡</div>
      </aside>
      <main class="main pickup-main">
        <section class="query-panel ui-query-card query-collapsed" id="queryCard">
          <div class="query-grid ui-query-flow" id="queryGrid">
            <div class="query-item query-combo"><select class="control query-type-select" id="codeType"><option value="no">提货单号</option><option value="planNo">发货计划号</option><option value="shipNo">发货单号</option><option value="batchNo">入库批次号</option></select><input class="control query-combo-input" id="codeText" placeholder="请输入单号，支持多个，用逗号、空格或换行隔开"></div>
            <div class="query-item query-combo"><select class="control query-type-select" id="skuType"><option value="sku">SKU</option><option value="name">产品名称</option></select><input class="control query-combo-input" id="skuText" placeholder="请输入SKU，支持多个，用逗号、空格或换行隔开"></div>
            <div class="query-item"><select class="control" id="sourceWarehouseQuery"><option value="">请选择提货仓</option><option>常州市佳士精密工业有限公司仓库</option><option>深圳市摩仕达焊接设备有限公司仓库</option><option>坪山石井本地仓</option></select></div>
            <div class="query-item"><select class="control" id="targetWarehouseQuery"><option value="跨跃猫物流仓" selected>目标入库仓：跨跃猫物流仓</option></select></div>
            <div class="query-item"><select class="control" id="teamQuery"><option value="">请选择团队</option><option>亚马逊团队</option><option>Jasic团队</option><option>欧洲运营组</option><option>北美大件组</option><option>刘绎天</option></select></div>
            <div class="query-item"><select class="control" id="creatorQuery"><option value="">请选择创建人</option><option>系统自动</option><option>Admin</option><option>张敏</option><option>李晨</option></select></div>
            <div class="query-item query-date-item"><select class="control query-time-type" id="timeType"><option value="createdAt">创建时间</option><option value="expectedDate">预计提货日</option></select><div class="date-group"><input id="startDate" type="date" aria-label="开始日期"><span>至</span><input id="endDate" type="date" aria-label="结束日期"></div></div>
            <div class="query-item query-action-item"><div class="query-actions ui-query-actions"><button class="query-inline-expand" id="queryExpand" type="button" hidden><span class="query-arrow">⌄</span><span class="query-expand-text">展开</span></button><button class="btn primary" id="searchBtn">查询</button><button class="btn" id="resetBtn">重置</button></div></div>
          </div>
        </section>
        <section class="action-strip ui-action-row">
          <div class="head-actions"><button class="btn primary" id="newBtn">新建提货单</button><button class="btn success" id="batchSubmitBtn" disabled>提交</button><button class="btn danger" id="batchVoidBtn" disabled>作废</button><button class="btn" id="exportBtn">导出</button><button class="btn" id="anomalyLogBtn" type="button">异常记录 <em class="head-badge" id="anomalyCountBadge" hidden>0</em></button></div>
          <button class="column-config-trigger" id="colConfigBtn" type="button" title="列配置" aria-label="列配置"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="3" width="15" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 3v14m5-14v14" stroke="currentColor" stroke-width="1.3"/></svg></button>
        </section>
        <section class="list-card ui-list-card">
          <section class="status-bar"><div class="status-tabs" id="statusTabs"></div></section>
          <section class="table-area ui-table-wrap"><table class="pickup-table document-list ui-table" id="mainTable"><colgroup id="tableColgroup"></colgroup><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table><div class="empty" id="empty" hidden>暂无符合条件的提货单</div></section>
          <footer class="bottom-bar"><div class="bottom-summary" id="bottomSummary"></div><div class="pager"><span>共 <b id="totalCount">0</b> 张提货单</span><select class="control page-size" id="pageSize"><option value="10">10条/页</option><option value="20">20条/页</option><option value="50">50条/页</option></select><button class="page-btn" id="prevPage">‹</button><span id="pageButtons"></span><button class="page-btn" id="nextPage">›</button></div></footer>
        </section>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="../../ui-kit.js?v=1.0.0"></script>
  <script src="./app.js?v=2.3.0"></script>
  <script src="../../custom-select.js?v=1.0.0"></script>
  <script src="../../navigation.js?v=1.8.02"></script>
</body>
</html>
