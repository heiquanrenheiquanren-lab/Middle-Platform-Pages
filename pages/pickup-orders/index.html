<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>提货单</title>
  <link rel="stylesheet" href="../transfer-orders/styles.css?v=1.0.24">
  <link rel="stylesheet" href="../../document-list.css?v=1.0.1">
  <link rel="stylesheet" href="../../navigation.css?v=1.7.89">
  <link rel="stylesheet" href="../../custom-select.css?v=1.0.0">
  <link rel="stylesheet" href="./styles.css?v=1.0.0">
</head>
<body data-ui-kit-page="standard" class="ui-page-canvas">
  <div class="app">
    <header class="global-bar">
      <div class="global-left"><span class="brand-shield"></span><button class="top-icon">工作台</button><button class="top-icon" data-module="basic">基础</button><button class="top-icon">财务</button><button class="top-icon active">供应链</button><button class="top-icon">运营</button><button class="top-icon">产品</button></div>
      <div class="global-right"><span class="admin">Admin⌄</span></div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div class="nav-scroll">
          <div class="nav-group-title"><span>♙</span><span>库存管理</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="inventoryQuery">库存查询</div>
          <div class="nav-item" data-page-nav="processingOrder">加工单</div>
          <div class="nav-item" data-page-nav="transferOrder">调拨单</div>
          <div class="nav-item" data-page-nav="inventoryAdjustment">损益单</div>
          <div class="nav-item active" data-page-nav="pickupOrder">提货单</div>
          <div class="nav-group-title"><span>♧</span><span>计划管理</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="forecast">需求预测</div><div class="nav-item" data-page-nav="stock">备货计划</div><div class="nav-item" data-page-nav="purchase">采购计划</div><div class="nav-item" data-page-nav="shipment">发货计划</div>
          <div class="nav-group-title"><span>▱</span><span>供应链协同</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="purchaseOrder">采购单</div><div class="nav-item" data-page-nav="shipmentOrder">发货单</div><div class="nav-item" data-page-nav="skuFirstLegCost">头程费用</div>
        </div>
        <div class="collapse">≡</div>
      </aside>
      <main class="main pickup-main">
        <section class="query-panel ui-query-card query-collapsed" id="queryCard">
          <div class="query-grid ui-query-flow" id="queryGrid">
            <div class="query-item query-combo"><select class="control query-type-select" id="codeType"><option value="no">提货单号</option><option value="shipmentNo">关联发货单号</option><option value="purchaseNo">采购单号</option></select><input class="control query-combo-input" id="codeText" placeholder="请输入提货单号，支持输入多个，用逗号、空格或换行隔开"></div>
            <div class="query-item query-combo"><select class="control query-type-select" id="skuType"><option value="sku">SKU</option><option value="name">产品名称</option></select><input class="control query-combo-input" id="skuText" placeholder="请输入SKU，支持输入多个，用逗号、空格或换行隔开"></div>
            <div class="query-item"><select class="control" id="supplierQuery"><option value="">请选择供应商</option><option>JASIC 精密</option><option>摩仕达供应商</option><option>华南五金</option></select></div>
            <div class="query-item"><select class="control" id="sourceWarehouseQuery"><option value="">请选择提货仓</option><option>JASIC 精密一厂</option><option>摩仕达东莞仓</option><option>华南五金仓</option></select></div>
            <div class="query-item"><select class="control" id="targetWarehouseQuery"><option value="">请选择目标仓</option><option>华南物流中转仓</option><option>马士基深圳仓</option><option>平山自营仓</option></select></div>
            <div class="query-item"><select class="control" id="reconcileQuery"><option value="">对账状态</option><option>未对账</option><option>部分对账</option><option>已对账</option></select></div>
            <div class="query-item"><select class="control" id="creatorQuery"><option value="">请选择创建人</option><option>Admin</option><option>张敏</option><option>李晨</option></select></div>
            <div class="query-item query-date-item"><select class="control query-time-type" id="timeType"><option value="createdAt">创建时间</option><option value="completedAt">完成时间</option></select><div class="date-group"><input id="startDate" type="date" aria-label="开始日期"><span>至</span><input id="endDate" type="date" aria-label="结束日期"></div></div>
            <div class="query-item query-action-item"><div class="query-actions ui-query-actions"><button class="query-inline-expand" id="queryExpand" type="button" hidden><span class="query-arrow">⌄</span><span class="query-expand-text">展开</span></button><button class="btn primary" id="searchBtn">查询</button><button class="btn" id="resetBtn">重置</button></div></div>
          </div>
        </section>
        <section class="action-strip ui-action-row"><div class="head-actions"><button class="btn primary" id="newBtn">新建提货单</button><button class="btn" id="importBtn">导入新建</button><button class="btn" id="exportBtn">导出</button></div></section>
        <section class="list-card ui-list-card">
          <section class="status-bar"><div class="status-tabs" id="statusTabs"></div></section>
          <section class="table-area ui-table-wrap"><table class="pickup-table document-list ui-table"><colgroup><col class="check-col"><col class="expand-col"><col class="no-col"><col class="route-col"><col class="relation-col"><col class="summary-col"><col class="reconcile-col"><col class="remark-col"><col class="creator-col"><col class="action-col"></colgroup><thead><tr><th><input id="selectAll" type="checkbox" aria-label="全选"></th><th></th><th>提货单号</th><th>提货信息</th><th>关联单据</th><th>数量汇总</th><th>对账信息</th><th>备注</th><th>创建信息</th><th>操作</th></tr></thead><tbody id="tableBody"></tbody></table><div class="empty" id="empty" hidden>暂无符合条件的提货单</div></section>
          <footer class="bottom-bar"><div>已选 <b id="selectedCount">0</b> 条结果</div><div class="pager"><span>共 <b id="totalCount">0</b> 张</span><select class="control page-size" id="pageSize"><option value="10">10张/页</option><option value="20">20张/页</option><option value="50">50张/页</option></select><button class="page-btn" id="prevPage">‹</button><span id="pageButtons"></span><button class="page-btn" id="nextPage">›</button></div></footer>
        </section>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="../../ui-kit.js?v=1.0.0"></script>
  <script src="./app.js?v=1.0.0"></script>
  <script src="../../custom-select.js?v=1.0.0"></script>
  <script src="../../navigation.js?v=1.7.89"></script>
</body>
</html>
