<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>供应链中台｜头程费用</title>
  <link rel="stylesheet" href="../../vendor/element-plus.css">
  <link rel="stylesheet" href="styles.css?v=1.7.38">
  <link rel="stylesheet" href="../../global-export.css?v=1.0.0">
  <link rel="stylesheet" href="../../navigation.css?v=1.7.99">
</head>
<body data-ui-kit-page="standard" class="ui-page-canvas">
<div id="app" v-cloak>
  <div class="app-shell">
    <header class="global-bar">
      <div class="global-left"><span class="brand-shield"></span><button class="top-icon">工作台</button><button class="top-icon active">财务</button><button class="top-icon">供应链</button><button class="top-icon">运营</button><button class="top-icon">产品</button><button class="top-icon">企业工单</button></div>
      <div class="global-right"><span class="admin">Admin⌄</span></div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div class="nav-scroll">
          <div class="nav-group-title"><span>♘</span><span>成本核算</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="movingWeightedAverageCost"><span class="mini">¥</span>移动加权价</div>
          <div class="nav-item active" data-page-nav="skuFirstLegCost"><span class="mini">¥</span>头程费用</div>
        </div>
        <div class="collapse">≡</div>
      </aside>
      <main class="main">
        <section class="content">
          <div class="card query-card">
            <div class="query-grid">
              <div class="query-item query-combo query-code-combo">
                <el-select v-model="query.orderType" filterable class="query-type-select" aria-label="单号类型">
                  <el-option label="中台发货单号" value="middleOrder"></el-option>
                  <el-option label="易仓 ERP 单号" value="erpOrder"></el-option>
                </el-select>
                <el-input v-model="query.orderNo" clearable :placeholder="orderPlaceholder" aria-label="单号查询" @keyup.enter="applyQuery"></el-input>
              </div>
              <div class="query-item query-combo query-sku-combo">
                <el-select v-model="query.skuType" filterable class="query-type-select" aria-label="SKU类型">
                  <el-option label="SKU" value="sku"></el-option>
                  <el-option label="海外仓 SKU" value="overseasSku"></el-option>
                  <el-option label="FNSKU" value="fnsku"></el-option>
                </el-select>
                <el-input v-model="query.sku" clearable :placeholder="skuPlaceholder" aria-label="SKU查询" @keyup.enter="applyQuery"></el-input>
              </div>
              <div class="query-item"><el-input v-model="query.planNo" clearable placeholder="请输入发货计划，支持输入多个" aria-label="发货计划"></el-input></div>
              <div class="query-item"><el-select v-model="query.destinations" multiple clearable filterable collapse-tags collapse-tags-tooltip placeholder="请选择目的仓" class="query-select"><el-option v-for="item in destinations" :key="item" :label="item" :value="item"></el-option></el-select></div>
              <div class="query-item"><el-select v-model="query.countries" multiple clearable filterable collapse-tags collapse-tags-tooltip placeholder="请选择国家" class="query-select"><el-option v-for="item in countries" :key="item" :label="item" :value="item"></el-option></el-select></div>
              <div class="query-item"><el-select v-model="query.channels" multiple clearable filterable collapse-tags collapse-tags-tooltip placeholder="请选择物流渠道" class="query-select"><el-option v-for="item in channels" :key="item" :label="item" :value="item"></el-option></el-select></div>
              <div class="query-item"><el-select v-model="query.transports" multiple clearable filterable collapse-tags collapse-tags-tooltip placeholder="请选择运输方式" class="query-select"><el-option v-for="item in transports" :key="item" :label="item" :value="item"></el-option></el-select></div>
              <div class="query-item"><el-select v-model="query.platforms" multiple clearable filterable collapse-tags collapse-tags-tooltip placeholder="请选择平台" class="query-select"><el-option v-for="item in platforms" :key="item" :label="item" :value="item"></el-option></el-select></div>
              <div class="query-item"><el-select v-model="query.stores" multiple clearable filterable collapse-tags collapse-tags-tooltip placeholder="请选择店铺" class="query-select"><el-option v-for="item in stores" :key="item" :label="item" :value="item"></el-option></el-select></div>
              <div class="query-item"><el-select v-model="query.teams" multiple clearable filterable collapse-tags collapse-tags-tooltip placeholder="请选择团队" class="query-select"><el-option v-for="item in teams" :key="item" :label="item" :value="item"></el-option></el-select></div>
              <div class="query-item query-advanced-item query-date-item"><el-date-picker v-model="query.createdRange" type="daterange" value-format="YYYY-MM-DD" range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期" class="query-date-picker" aria-label="创建日期范围"></el-date-picker></div>
              <div class="query-item query-advanced-item"><el-select v-model="query.hasDiff" clearable placeholder="请选择分摊差异" class="query-select"><el-option label="有差异" value="yes"></el-option><el-option label="无差异" value="no"></el-option></el-select></div>
              <div class="query-item query-advanced-item"><el-select v-model="query.hasAnomaly" clearable placeholder="请选择是否异常" class="query-select"><el-option label="是" value="yes"></el-option><el-option label="否" value="no"></el-option></el-select></div>
              <div class="query-item query-action-item">
                <div class="query-actions">
                  <el-button type="primary" @click="applyQuery">查询</el-button>
                  <el-button @click="resetQuery">重置</el-button>
                </div>
              </div>
            </div>
          </div>

          <div class="action-bar"><el-button @click="exportData">导出</el-button></div>

          <section class="table-card card">
            <div class="table-scroll">
              <el-table :data="pageRows" class="cost-table" show-summary :summary-method="summaryMethod">
                <el-table-column prop="destination" label="目的仓" min-width="92" fixed="left" label-class-name="summary-label"></el-table-column>
                <el-table-column prop="country" label="国家" min-width="106" fixed="left"></el-table-column>
                <el-table-column label="发货单号" min-width="232" fixed="left">
                  <template #default="{row}">
                    <div class="stack-cell">
                      <span class="order-line">
                        <em>中台：</em><span>{{row.middleOrder}}</span>
                        <el-tooltip v-if="row.hasAnomaly" placement="top-start" effect="dark">
                          <template #content>
                            <div class="anomaly-tooltip">
                              <div class="anomaly-tooltip-title">分摊异常</div>
                              <div v-for="(msg,idx) in row.orderAnomalyMessages" :key="idx" class="anomaly-tooltip-item">• {{msg}}</div>
                              <div class="anomaly-tooltip-guide">处理建议：请先补齐基础资料后，在发货单重新保存费用以触发重算。</div>
                            </div>
                          </template>
                          <span class="order-anomaly-badge" aria-label="分摊异常"><span class="order-anomaly-icon">!</span><span>异常</span></span>
                        </el-tooltip>
                      </span>
                      <span class="order-line"><em>易仓 ERP：</em>{{row.erpOrder||'—'}}</span>
                    </div>
                  </template>
                </el-table-column>
                <el-table-column prop="sku" label="SKU" min-width="140" fixed="left"></el-table-column>
                <el-table-column label="海外仓 SKU/FNSKU" min-width="190" fixed="left">
                  <template #default="{row}"><div class="stack-cell"><span><em>海外仓 SKU：</em>{{row.overseasSku||'—'}}</span><span class="sub-value"><em>FNSKU：</em>{{row.fnsku||'—'}}</span></div></template>
                </el-table-column>
                <el-table-column label="履约数量" min-width="115" align="right">
                  <template #default="{row}"><div class="stack-cell number-cell"><span><em>实际发货：</em>{{row.shippedQty}}</span><span class="sub-value"><em>收货：</em>{{row.receiveQty}}</span></div></template>
                </el-table-column>
                <el-table-column label="发货单总费用" min-width="120" align="right">
                  <template #header>
                    <span class="diff-header">发货单总费用<el-tooltip placement="top"><template #content>发货单总费用 = 头程物流费 + 清关税费 + 其他物流费用</template><span class="help-icon">?</span></el-tooltip></span>
                  </template>
                  <template #default="{row}"><span class="money-value">{{money(row.totalCost)}}</span></template>
                </el-table-column>
                <el-table-column label="物流费用" min-width="116" align="right">
                  <template #header>
                    <span class="diff-header">物流费用<el-tooltip placement="top"><template #content>物流费用 = 头程物流费 + 其他物流费用</template><span class="help-icon">?</span></el-tooltip></span>
                  </template>
                  <template #default="{row}"><span :class="row.logisticsCost!=null?'money-value':'empty-cost'">{{money(row.logisticsCost)}}</span></template>
                </el-table-column>
                <el-table-column label="清关税费" min-width="126" align="right">
                  <template #default="{row}"><span :class="row.clearanceTotal!=null?'money-value':'empty-cost'">{{money(row.clearanceTotal)}}</span></template>
                </el-table-column>
                <el-table-column label="总单位头程成本" min-width="147" align="right" label-class-name="summary-cost">
                  <template #header>
                    <span class="diff-header">总单位头程成本<el-tooltip placement="top"><template #content>总单位头程成本=单位物流费用分摊+单位清关税费分摊</template><span class="help-icon">?</span></el-tooltip></span>
                  </template>
                  <template #default="{row}"><span v-if="row.unitCost==null" class="empty-cost" :title="row.hasAnomaly?'物流或清关分摊存在异常，暂无法计算总单位头程成本':(row.shippedQty<=0?'实际发货为 0，不参与分摊':'')">—</span><span v-else class="cost-value">{{money(row.unitCost)}}</span></template>
                </el-table-column>
                <el-table-column label="单位物流费用分摊" min-width="150" align="right">
                  <template #header>
                    <span class="diff-header">单位物流费用分摊<el-tooltip placement="top"><template #content>按计费重占比分摊物流费用：计费重 = MAX(包装毛重×实发数量, 包装长×宽×高÷体积参数×实发数量)</template><span class="help-icon">?</span></el-tooltip></span>
                  </template>
                  <template #default="{row}"><span v-if="row.logisticsRowIssue" class="clearance-missing" :title="row.logisticsRowIssue">资料缺失</span><span v-else-if="row.logisticsBlocked&&row.shippedQty>0" class="empty-cost" :title="row.logisticsBlockReason">—</span><span v-else :class="row.unitFreightCost!=null?'money-value':'empty-cost'">{{money(row.unitFreightCost)}}</span></template>
                </el-table-column>
                <el-table-column label="单位清关税费分摊" min-width="140" align="right">
                  <template #header>
                    <span class="diff-header">单位清关税费分摊<el-tooltip placement="top"><template #content>按权重分摊发货单清关税费总额：权重 = 实际发货数量 × 目的国清关单价 × 清关税率；单位分摊 = 该 SKU 分摊总额 ÷ 实际发货数量</template><span class="help-icon">?</span></el-tooltip></span>
                  </template>
                  <template #default="{row}"><span v-if="row.clearanceRowIssue" class="clearance-missing" :title="row.clearanceRowIssue">资料缺失</span><span v-else-if="row.clearanceBlocked&&row.shippedQty>0" class="empty-cost" :title="row.clearanceBlockReason">—</span><span v-else :class="row.unitTariffCost!=null?'money-value':'empty-cost'">{{money(row.unitTariffCost)}}</span></template>
                </el-table-column>
                <el-table-column label="清关单价" min-width="98" align="right">
                  <template #header>
                    <span class="diff-header">清关单价<el-tooltip placement="top"><template #content>按 SKU + 目的国从产品列表清关费用中取的每件清关价格，人民币口径。</template><span class="help-icon">?</span></el-tooltip></span>
                  </template>
                  <template #default="{row}"><span :class="row.clearancePrice!=null?'money-value':'empty-cost'">{{money(row.clearancePrice)}}</span></template>
                </el-table-column>
                <el-table-column label="清关税率" min-width="93" align="right">
                  <template #header>
                    <span class="diff-header">清关税率<el-tooltip placement="top"><template #content>按 SKU + 目的国从产品列表清关费用中取的税率，用于计算分摊权重。</template><span class="help-icon">?</span></el-tooltip></span>
                  </template>
                  <template #default="{row}"><span :class="row.clearanceRate!=null?'money-value':'empty-cost'">{{percent(row.clearanceRate)}}</span></template>
                </el-table-column>
                <el-table-column label="分摊差异" min-width="130" align="right">
                  <template #header>
                    <span class="diff-header">分摊差异<el-tooltip placement="top"><template #content>分摊差异 = 物流费用差异 + 清关税费差异<br>物流费用差异 = Σ（单位物流费用分摊 × 实际发货数量）− 物流费用<br>清关税费差异 = Σ（单位清关税费分摊 × 实际发货数量）− 清关税费<br>按原始精度计算；0 表示分摊完整，负数表示有费用未分摊到 SKU；同一发货单下所有 SKU 行相同。</template><span class="help-icon">?</span></el-tooltip></span>
                  </template>
                  <template #default="{row}">
                    <div class="stack-cell diff-stack">
                      <span><em>物流差异：</em><span :class="row.freightDiff==null?'empty-cost':(Math.abs(row.freightDiff)<0.005?'zero-diff':'diff-value')">{{money(row.freightDiff)}}</span></span>
                      <span><em>清关差异：</em><span :class="row.tariffDiff==null?'empty-cost':(Math.abs(row.tariffDiff)<0.005?'zero-diff':'diff-value')">{{money(row.tariffDiff)}}</span></span>
                    </div>
                  </template>
                </el-table-column>
                <el-table-column label="物流信息" min-width="175">
                  <template #default="{row}"><div class="stack-cell"><span><em>运输方式：</em>{{row.transport}}</span><span class="sub-value"><em>物流渠道：</em>{{row.channel}}</span></div></template>
                </el-table-column>
                <el-table-column label="创建时间" min-width="125"><template #default="{row}">{{row.createdAt||'—'}}</template></el-table-column>
              </el-table>
            </div>
            <div class="table-footer"><el-pagination v-model:current-page="page" background layout="total, prev, pager, next" :page-size="pageSize" :total="filteredRows.length"></el-pagination></div>
          </section>
        </section>
      </main>
    </div>
  </div>
</div>
<script src="../../vendor/vue.global.prod.js"></script>
<script src="../../vendor/element-plus.js"></script>
<script src="../../vendor/xlsx.full.min.js"></script>
<script src="app.js?v=1.7.38"></script>
<script src="../../global-export.js?v=1.7.38"></script>
  <script src="../../navigation.js?v=1.8.02"></script>
</body>
</html>
