<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>供应链中台｜头程费用</title>
  <link rel="stylesheet" href="../../vendor/element-plus.css">
  <link rel="stylesheet" href="styles.css?v=1.7.22">
</head>
<body>
<div id="app" v-cloak>
  <div class="app-shell">
    <header class="global-bar">
      <div class="global-left"><span class="brand-shield"></span><span class="top-icon">▣</span><span class="top-icon">◉</span><span class="top-icon active">⛓</span><span class="top-icon">▥</span><span class="top-icon">▤</span><span class="top-icon">▧</span></div>
      <div class="global-right"><span class="global-icon">⟳</span><span class="global-icon">⛶</span><span class="admin">Admin⌄</span></div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div class="nav-scroll">
          <div class="nav-group-title"><span>♙</span><span>库存管理</span><span class="chev">⌃</span></div>
          <div class="nav-item"><span class="mini">▤</span>团队库存</div>
          <div class="nav-item"><span class="mini">▥</span>平台仓&海外仓</div>
          <div class="nav-item" data-page-nav="supplierInventory"><span class="mini">▱</span>供应商库存</div>
          <div class="nav-group-title"><span>♧</span><span>计划管理</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="forecast"><span class="mini">▣</span>需求预测</div>
          <div class="nav-item" data-page-nav="stock"><span class="mini">▤</span>备货计划</div>
          <div class="nav-item" data-page-nav="purchase"><span class="mini">▥</span>采购计划</div>
          <div class="nav-item" data-page-nav="shipment"><span class="mini">♨</span>发货计划</div>
          <div class="nav-group-title"><span>▱</span><span>供应链协同</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="purchaseOrder"><span class="mini">▰</span>采购单</div>
          <div class="nav-item" data-page-nav="shipmentOrder"><span class="mini">▤</span>发货单</div>
          <div class="nav-item active"><span class="mini">¥</span>头程费用</div>
        </div>
        <div class="collapse">≡</div>
      </aside>
      <main class="main">
        <section class="content">
          <div class="page-head">
            <h1 class="page-title">头程费用</h1>
            <div class="page-desc">按发货单 SKU 明细查询已有头程分摊结果，金额统一使用 CNY</div>
          </div>

          <div class="card query-card" :class="{'expanded': queryExpanded}">
            <el-form label-position="top" size="default">
              <div class="query-grid">
                <el-form-item label="发货单号">
                  <div class="query-code-control">
                    <el-select v-model="query.orderType" class="code-type" filterable>
                      <el-option label="中台发货单号" value="middleOrder"></el-option>
                      <el-option label="ERP发货单号" value="erpOrder"></el-option>
                    </el-select>
                    <el-input v-model="query.orderNo" clearable placeholder="请输入发货单号"></el-input>
                  </div>
                </el-form-item>
                <el-form-item label="SKU">
                  <div class="query-code-control">
                    <el-select v-model="query.skuType" class="code-type" filterable>
                      <el-option label="SKU" value="sku"></el-option>
                      <el-option label="海外仓 SKU" value="overseasSku"></el-option>
                      <el-option label="FNSKU" value="fnsku"></el-option>
                    </el-select>
                    <el-input v-model="query.sku" clearable placeholder="请输入 SKU，多个用逗号、空格或换行隔开"></el-input>
                  </div>
                </el-form-item>
                <el-form-item label="目的仓"><el-select v-model="query.destinations" multiple clearable filterable collapse-tags collapse-tags-tooltip placeholder="全部目的仓"><el-option v-for="item in destinations" :key="item" :label="item" :value="item"></el-option></el-select></el-form-item>
                <el-form-item label="发货计划"><el-input v-model="query.planNo" clearable placeholder="请输入发货计划"></el-input></el-form-item>
                <el-form-item label="平台"><el-select v-model="query.platforms" multiple clearable filterable collapse-tags collapse-tags-tooltip placeholder="全部平台"><el-option v-for="item in platforms" :key="item" :label="item" :value="item"></el-option></el-select></el-form-item>
                <el-form-item label="店铺"><el-select v-model="query.stores" multiple clearable filterable collapse-tags collapse-tags-tooltip placeholder="全部店铺"><el-option v-for="item in stores" :key="item" :label="item" :value="item"></el-option></el-select></el-form-item>
                <el-form-item label="团队" class="advanced-control"><el-select v-model="query.teams" multiple clearable filterable collapse-tags collapse-tags-tooltip placeholder="全部团队"><el-option v-for="item in teams" :key="item" :label="item" :value="item"></el-option></el-select></el-form-item>
                <el-form-item label="运输方式" class="advanced-control"><el-select v-model="query.transports" multiple clearable filterable collapse-tags collapse-tags-tooltip placeholder="全部运输方式"><el-option v-for="item in transports" :key="item" :label="item" :value="item"></el-option></el-select></el-form-item>
                <el-form-item label="物流渠道" class="advanced-control"><el-select v-model="query.channels" multiple clearable filterable collapse-tags collapse-tags-tooltip placeholder="全部物流渠道"><el-option v-for="item in channels" :key="item" :label="item" :value="item"></el-option></el-select></el-form-item>
                <el-form-item label="创建人" class="advanced-control"><el-select v-model="query.creators" multiple clearable filterable collapse-tags collapse-tags-tooltip placeholder="全部创建人"><el-option v-for="item in creators" :key="item" :label="item" :value="item"></el-option></el-select></el-form-item>
                <el-form-item label="创建日期" class="advanced-control"><el-date-picker v-model="query.createdRange" type="daterange" value-format="YYYY-MM-DD" range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期"></el-date-picker></el-form-item>
                <el-form-item label="是否有差异" class="advanced-control"><el-select v-model="query.hasDiff" clearable placeholder="全部"><el-option label="是" value="yes"></el-option><el-option label="否" value="no"></el-option></el-select></el-form-item>
              </div>
              <div class="query-actions"><el-button type="primary" @click="applyQuery">查询</el-button><el-button @click="resetQuery">重置</el-button><el-button v-if="hasAdvanced" link type="primary" :class="{'expanded':queryExpanded}" @click="queryExpanded=!queryExpanded">{{queryExpanded?'收起':'展开'}}<span class="expand-arrow">{{queryExpanded?'⌃':'⌄'}}</span></el-button></div>
            </el-form>
          </div>

          <div class="action-bar"><el-button type="primary" plain @click="exportData">导出</el-button><el-button :loading="refreshing" @click="refreshData">刷新</el-button></div>

          <section class="table-card card">
            <div class="table-head"><div><b>头程费用明细</b><span class="count">共 {{filteredRows.length}} 条</span></div><span class="currency-tag">CNY</span></div>
            <div class="table-scroll">
              <el-table :data="pageRows" border class="cost-table" :fit="false">
                <el-table-column prop="destination" label="目的仓" width="140" fixed="left"></el-table-column>
                <el-table-column label="发货单号" width="250" fixed="left">
                  <template #default="{row}"><div class="stack-cell"><span><em>中台：</em><a>{{row.middleOrder}}</a></span><span><em>ERP：</em>{{row.erpOrder||'—'}}<el-tag v-if="row.erpOrder&&row.erpOrder!=='—'" size="small" type="info" class="erp-source-tag">易仓</el-tag></span></div></template>
                </el-table-column>
                <el-table-column label="平台 / 店铺 / 团队" width="200" fixed="left">
                  <template #default="{row}"><div class="stack-cell"><span><em>平台：</em>{{row.platform}}</span><span class="sub-value"><em>店铺：</em>{{row.store}}</span><span class="sub-value"><em>团队：</em>{{row.team}}</span></div></template>
                </el-table-column>
                <el-table-column prop="sku" label="SKU" width="170" fixed="left"></el-table-column>
                <el-table-column prop="planNo" label="发货计划" width="175"></el-table-column>
                <el-table-column label="履约数量" width="140" align="right">
                  <template #default="{row}"><div class="stack-cell number-cell"><span><em>实际发货：</em>{{row.shippedQty}}</span><span class="sub-value"><em>收货：</em>{{row.receiveQty}}</span></div></template>
                </el-table-column>
                <el-table-column label="发货单总费用" width="160" align="right">
                  <template #default="{row}"><span>{{row.totalCost||'—'}}</span></template>
                  <template #append><div class="total-cell">{{totalCostSum}}</div></template>
                </el-table-column>
                <el-table-column label="SKU单位头程成本（CNY）" width="180" align="right">
                  <template #default="{row}"><span :class="row.unitCost?'cost-value':'empty-cost'">{{row.unitCost||'—'}}</span></template>
                  <template #append><div class="total-cell cost-value">{{totalUnitCostSum}}</div></template>
                </el-table-column>
                <el-table-column label="差异" width="130" align="right">
                  <template #default="{row}"><span :class="row.diff===0?'zero-diff':(row.diff?'diff-value':'empty-cost')">{{row.diff!=null?(row.diff===0?'0':row.diff.toFixed(2)):'—'}}</span></template>
                </el-table-column>
                <el-table-column label="物流信息" width="200">
                  <template #default="{row}"><div class="stack-cell"><span><em>运输方式：</em>{{row.transport}}</span><span class="sub-value"><em>物流渠道：</em>{{row.channel}}</span></div></template>
                </el-table-column>
                <el-table-column label="创建时间" width="160"><template #default="{row}">{{row.createdAt||'—'}}</template></el-table-column>
              </el-table>
            </div>
            <div class="table-footer"><span>实际发货数量为 0 时单位成本显示 "—"</span><el-pagination v-model:current-page="page" background layout="total, prev, pager, next" :page-size="pageSize" :total="filteredRows.length"></el-pagination></div>
          </section>
        </section>
      </main>
    </div>
  </div>
</div>
<script src="../../vendor/vue.global.prod.js"></script>
<script src="../../vendor/element-plus.js"></script>
<script src="app.js?v=1.7.22"></script>
</body>
</html>
