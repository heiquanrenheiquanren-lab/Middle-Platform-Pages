<!doctype html>
<!-- 备货计划查询区域原型 v1.0.2 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>备货计划｜查询区域交互原型</title>
  <link rel="stylesheet" href="./styles.css?v=1.3.0">
</head>
<body>
  <div class="toast" id="toast">查询完成</div>
  <div class="app">
    <header class="global-bar">
      <div class="global-left"><span class="brand-shield"></span><span class="top-icon">▣</span><span class="top-icon">◉</span><span class="top-icon active">⛓</span><span class="top-icon">▥</span><span class="top-icon">▤</span><span class="top-icon">▧</span></div>
      <div class="global-right"><span class="icon">⟳</span><span class="icon">⛶</span><span class="admin">Admin⌄</span></div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div class="nav-scroll">
          <div class="nav-group-title"><span>♙</span><span>库存管理</span><span class="chev">⌃</span></div>
          <div class="nav-item"><span class="mini">▤</span>团队库存</div><div class="nav-item"><span class="mini">▥</span>平台仓&海外仓</div><div class="nav-item" data-page-nav="supplierInventory"><span class="mini">▱</span>供应商库存</div>
          <div class="nav-group-title"><span>♧</span><span>计划管理</span><span class="chev">⌃</span></div>
          <div class="nav-item"><span class="mini">▣</span>需求预测</div><div class="nav-item active" data-page-nav="stock"><span class="mini">▤</span>备货计划</div><div class="nav-item" data-page-nav="purchase"><span class="mini">▥</span>采购计划</div><div class="nav-item" data-page-nav="shipment"><span class="mini">♨</span>发货计划</div>
          <div class="nav-group-title"><span>▱</span><span>供应链协同</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="purchaseOrder"><span class="mini">▰</span>采购单</div><div class="nav-item" data-page-nav="shipmentOrder"><span class="mini">▤</span>发货单</div>
        </div><div class="collapse">≡</div>
      </aside>
      <main class="main">
        <section class="page-head"><div class="page-tab"><span>▦</span><span>备货计划</span></div></section>
        <section class="query-panel" aria-label="新增查询区域">
          <div class="query-row">
            <select class="control code-type" id="codeType" title="编码类型"><option>SKU</option><option>领星 SKU</option><option>SellerSKU</option><option>ASIN</option></select>
            <div class="control tag-input code-box" id="codeBox"><div id="codeTags"></div><input id="codeInput" placeholder="请输入编码，支持多个，用逗号或空格隔开" autocomplete="off"></div>
            <input class="control plan-input" id="planNo" placeholder="请输入计划号，支持多个，用逗号或空格隔开"><input class="control name-input" id="productName" placeholder="品名">
            <div class="multi platform-box" id="platformMulti"><div class="multi-trigger" data-trigger>平台（可多选）</div><div class="dropdown" data-menu></div></div>
            <div class="multi country-box" id="countryMulti"><div class="multi-trigger" data-trigger>国家（可多选）</div><div class="dropdown" data-menu></div></div>
            <div class="multi store-box" id="storeMulti"><div class="multi-trigger" data-trigger>店铺（可多选）</div><div class="dropdown" data-menu></div></div>
          </div>
          <div class="query-row">
            <div class="multi team-box" id="teamMulti"><div class="multi-trigger" data-trigger>团队（可多选）</div><div class="dropdown" data-menu></div></div>
            <select class="control time-type" id="timeType"><option>创建时间</option><option>更新时间</option><option>期望交货时间</option></select>
            <div class="date-group"><input id="startDate" type="date" aria-label="开始日期"><span>至</span><input id="endDate" type="date" aria-label="结束日期"></div>
            <div class="multi creator-box" id="creatorMulti"><div class="multi-trigger" data-trigger>创建人（可多选）</div><div class="dropdown" data-menu></div></div>
            <div class="query-actions"><button class="btn primary" id="searchBtn">查询</button><button class="btn" id="resetBtn">重置</button></div>
          </div>
          <div class="query-row advanced-query-row">
            <input class="control order-input" id="purchaseNo" placeholder="采购单号，多个请用逗号或空格隔开">
            <input class="control order-input" id="planOrderNo" placeholder="计划单号，多个请用逗号或空格隔开">
            <input class="control remark-input" id="remark" placeholder="备货计划备注，支持模糊查询">
          </div>
          <button class="query-expand" id="queryExpand" type="button"><span class="query-arrow">⌄</span><span class="query-expand-text">展开</span></button>
        </section>
        <section class="action-strip"><div class="head-actions"><button class="btn primary">新建备货计划</button><button class="btn primary">备货计划管理清单</button></div></section>
        <section class="status-bar"><div class="status-tabs" id="statusTabs"></div><div class="status-tools"><label class="compare"><input id="compareToggle" type="checkbox" checked>显示销量环比</label><span class="tool" title="筛选">▽</span><span class="tool" title="搜索">⌕</span><span class="tool" title="设置">⚙</span><span class="tool" title="刷新" id="refreshBtn">↻</span><span class="tool" title="上传">↥</span><span class="tool" title="下载">↧</span><span class="tool" title="文档">▧</span></div></section>
        <section class="table-area" id="tableArea"><table class="stock-table"><thead><tr><th class="check"><input class="head-check" id="selectAll" type="checkbox"></th><th class="plan">计划号</th><th class="sku">SKU</th><th class="name">品名</th><th class="lx">领星SKU</th><th class="seller">SellerSKU/Asin</th><th class="small">平台</th><th class="small">店铺</th><th class="small">国家</th><th class="small">团队</th><th class="month">2026/08</th><th class="month">2026/09</th><th class="month">2026/10</th></tr></thead><tbody id="tableBody"></tbody></table></section>
        <footer class="bottom-bar"><div class="bottom-left"><span class="selected-count">已选 <b id="selectedCount">0</b> 条结果</span><button class="btn soft">确认</button><button class="btn soft">加入计划管理清单</button><button class="btn soft">生成采购计划</button><button class="btn soft">生成发货计划</button><button class="btn soft">作废</button></div><div class="bottom-right"><span>共 <b id="totalCount">32</b> 条</span><select class="control page-size" id="pageSize"><option value="25">25条/页</option><option value="10">10条/页</option><option value="50">50条/页</option></select><button class="page-btn" id="prevPage">‹</button><span id="pageButtons"></span><button class="page-btn" id="nextPage">›</button><span>前往</span><input class="control jump" id="jumpPage" value="1"><span>页</span></div></footer>
      </main>
    </div>
  </div>
  <script src="./app.js?v=1.3.0"></script>
</body>
</html>
