<!doctype html>
<!-- 采购单查询区域原型 v1.2.0 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>采购单｜查询区域交互原型</title>
  <link rel="stylesheet" href="../../vendor/element-plus.css">
  <link rel="stylesheet" href="./styles-1.7.60.css?v=1.7.62">
  <link rel="stylesheet" href="./column-config.css?v=1.0.1">
  <link rel="stylesheet" href="../../document-list.css?v=1.0.0">
  <link rel="stylesheet" href="./ownership.css?v=1.7.32">
  <link rel="stylesheet" href="../../global-export.css?v=1.0.0">
  <link rel="stylesheet" href="../../navigation.css?v=1.7.92">
  <link rel="stylesheet" href="../../custom-select.css?v=1.0.0">
</head>
<body data-ui-kit-page="standard" class="ui-page-canvas">
  <div class="toast" id="toast">查询完成</div>
  <div class="watermark-layer" id="watermarkLayer" aria-hidden="true"></div>
  <div class="app">
    <header class="global-bar">
      <div class="global-left"><span class="brand-shield"></span><button class="top-icon">工作台</button><button class="top-icon">财务</button><button class="top-icon active">供应链</button><button class="top-icon">运营</button><button class="top-icon">产品</button><button class="top-icon">企业工单</button></div>
      <div class="global-right"><span class="admin">Admin⌄</span></div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div class="nav-scroll">
          <div class="nav-group-title"><span>♙</span><span>库存管理</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="inventoryQuery"><span class="mini">▤</span>库存查询</div><div class="nav-item" data-page-nav="processingOrder"><span class="mini">▦</span>加工单</div><div class="nav-item" data-page-nav="transferOrder"><span class="mini">⇄</span>调拨单</div>
          <div class="nav-group-title"><span>♧</span><span>计划管理</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="forecast"><span class="mini">▣</span>需求预测</div><div class="nav-item" data-page-nav="stock"><span class="mini">▤</span>备货计划</div><div class="nav-item" data-page-nav="purchase"><span class="mini">▥</span>采购计划</div><div class="nav-item" data-page-nav="shipment"><span class="mini">♨</span>发货计划</div>
          <div class="nav-group-title"><span>▱</span><span>供应链协同</span><span class="chev">⌃</span></div>
          <div class="nav-item active" data-page-nav="purchaseOrder"><span class="mini">▰</span>采购单</div><div class="nav-item" data-page-nav="shipmentOrder"><span class="mini">▤</span>发货单</div><div class="nav-item" data-page-nav="skuFirstLegCost"><span class="mini">¥</span>头程费用</div>
        </div><div class="collapse">≡</div>
      </aside>
      <main class="main">
        <section class="query-panel" aria-label="新增查询区域">
          <div class="query-row" id="queryRowOne">
            <div class="query-item" data-query-order="1"><div class="code-query"><select class="control code-type" id="orderQueryType" aria-label="单号查询类型"><option value="purchase">采购单号</option><option value="plan">采购计划</option><option value="logistics">物流单号</option></select><input class="control po-number-input" id="purchaseOrderNo" placeholder="请输入单号，支持多个"></div></div>
            <div class="query-item" data-query-order="2"><div class="code-query"><select class="control code-type" id="skuQueryType" aria-label="SKU 查询类型"><option value="sku">SKU</option><option value="sellerSku">供应商料号</option><option value="lingxingSku">领星 SKU</option><option value="fnsku">FNSKU</option></select><input class="control sku-input" id="skuInput" placeholder="请输入编码，支持多个"></div></div>
            <div class="query-item" data-query-order="3"><input class="control common-input" id="productName" placeholder="请输入品名，支持模糊查询"></div>
            <div class="query-item" data-query-order="4"><div class="multi team-box" id="teamMulti"><div class="multi-trigger" data-trigger>团队</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="5"><div class="multi supplier-box" id="supplierMulti"><div class="multi-trigger" data-trigger>供应商</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="6"><input class="control common-input" id="batchNo" placeholder="收货批次，多个请用逗号或空格隔开"></div>
            <div class="query-item" data-query-order="7"><div class="multi warehouse-box" id="warehouseMulti"><div class="multi-trigger" data-trigger>采购仓库</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="8"><div class="multi platform-box" id="platformMulti"><div class="multi-trigger" data-trigger>平台</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="9"><div class="multi store-box" id="storeMulti"><div class="multi-trigger" data-trigger>店铺</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item time-query" data-query-order="10"><select class="control time-type" id="timeType"><option>收货时间</option><option>创建时间</option><option>更新时间</option></select><div class="date-group"><input id="startDate" type="date" aria-label="开始日期"><span>至</span><input id="endDate" type="date" aria-label="结束日期"></div></div>
            <div class="query-item" data-query-order="12"><div class="multi creator-box" id="creatorMulti"><div class="multi-trigger" data-trigger>创建人</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="13"><div class="quantity-query"><select class="control quantity-type" id="quantityType" aria-label="数量查询类型"><option value="transitQty">在途数量</option><option value="receiveQty">收货数量</option><option value="purchaseQty">采购数量</option></select><div class="quantity-range"><input id="quantityMin" type="text" inputmode="numeric" autocomplete="off" aria-label="数量范围最小值" placeholder="最小值"><span>至</span><input id="quantityMax" type="text" inputmode="numeric" autocomplete="off" aria-label="数量范围最大值" placeholder="最大值"></div></div></div>
          </div>
          <div class="query-row" id="queryRowTwo"><div class="query-actions"><button class="query-inline-expand" id="queryExpand" type="button" aria-expanded="false" hidden><svg class="query-arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg><span class="query-expand-text">展开</span></button><button class="btn primary" id="searchBtn">查询</button><button class="btn" id="resetBtn">重置</button></div></div>
          <div class="query-row advanced-query-row"></div>
        </section>
        <section class="action-strip"><div class="head-actions"><button class="btn" id="openBatchPurchaseReceive">批量收货</button><button class="btn success" id="auditPurchaseOrders" disabled>审核</button><button class="btn danger" id="batchVoidPurchase" disabled>作废</button><button class="btn" id="submitPurchaseReview" disabled>提交审核</button><button class="merge-pill" id="mergePill" type="button" hidden></button><button class="btn" id="mergePurchaseOrders" type="button" title="合并采购：将同供应商、同采购员、同采购仓库、同采购主体的待提交采购单合并为一张">合并采购</button><button class="btn" id="batchEditOrders" disabled style="display:none">批量编辑</button><button class="btn" id="openOwnershipAdjustment">货权调整</button></div><button class="btn" id="toggleListView" type="button" title="收起一级列表：每张采购单压缩为一行摘要">收起一级列表</button><button class="column-config-trigger" id="openColumnConfig" type="button" title="列配置" aria-label="列配置"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="3" width="15" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 3v14m5-14v14" stroke="currentColor" stroke-width="1.3"/></svg></button></section>
        <section class="status-bar"><div class="status-tabs" id="statusTabs"></div></section>
        <section class="table-area" id="tableArea"><table class="po-table document-list"><colgroup><col class="col-check"><col class="col-expand"><col class="col-po"><col class="col-supplier"><col class="col-amount"><col class="col-composition"><col class="col-inbound"><col class="col-logistics"><col class="col-remark"><col class="col-creator"><col class="col-action"></colgroup><thead><tr><th><input class="head-check" id="selectAll" type="checkbox"></th><th><button class="expand-btn" id="expandAllBtn" type="button" aria-label="展开全部采购单" aria-expanded="false" title="展开全部采购单">⌄</button></th><th>采购单号</th><th>供应商信息</th><th>采购单金额</th><th>金额构成</th><th>入库信息</th><th>物流信息</th><th>备注信息</th><th>创建信息</th><th>操作</th></tr></thead><tbody id="tableBody"></tbody></table></section>
        <footer class="bottom-bar"><div class="bottom-left"><span class="sum-stats" id="poSummary"></span></div><div class="bottom-right"><span>共 <b id="totalCount">13</b> 张</span><select class="control page-size" id="pageSize"><option value="10">10张/页</option><option value="25">25张/页</option><option value="50">50张/页</option></select><button class="page-btn" id="prevPage">‹</button><span id="pageButtons"></span><button class="page-btn" id="nextPage">›</button><span>前往</span><input class="control jump" id="jumpPage" value="1"><span>页</span></div></footer>
      </main>
    </div>
  </div>
  <div class="purchase-detail-modal" id="purchaseDetailModal" hidden role="dialog" aria-label="采购单详情"></div>
  <div class="purchase-log-modal" id="purchaseLogModal" hidden role="dialog" aria-label="采购单操作日志"></div>
  <div class="purchase-audit-modal" id="purchaseAuditModal" hidden role="dialog" aria-label="审核采购单"></div>
  <div class="receive-adjust-modal" id="receiveAdjustModal" hidden role="dialog" aria-label="修改收货数量"></div>
  <div class="purchase-receive-modal" id="purchaseReceiveModal" hidden role="dialog" aria-label="采购单收货"></div>
  <div class="purchase-receive-modal" id="purchaseFinishModal" hidden role="dialog" aria-label="结束到货"></div>
  <div class="purchase-batch-receive-modal" id="purchaseBatchReceiveModal" hidden role="dialog" aria-label="采购单批量收货"></div>
  <div class="purchase-complete-modal" id="purchaseCompleteModal" hidden role="dialog" aria-label="采购单手动完成"></div>
  <div class="purchase-create-modal" id="purchaseCreateModal" hidden role="dialog" aria-label="新建采购单"></div>
  <div class="purchase-batch-modal" id="batchEditModal" hidden role="dialog" aria-label="批量编辑采购单"></div>
  <div class="purchase-plan-sku-modal" id="purchasePlanSkuModal" hidden role="dialog" aria-label="从采购计划新增 SKU"></div>
  <div class="purchase-fee-apportion-modal" id="purchaseFeeApportionModal" hidden role="dialog" aria-label="采购运费分摊"></div>
  <div id="ownership-adjustment-app"></div>
  <script src="../../vendor/vue.global.prod.js"></script>
  <script src="../../vendor/element-plus.js"></script>
  <script src="./column-config-1.0.7.js?v=1.0.7"></script>
  <script src="./app-1.7.61.js?v=1.7.66"></script>
  <script src="./ownership.js?v=1.7.33"></script>
  <script src="../../global-export.js?v=1.7.37"></script>
  <script src="../../custom-select.js?v=1.0.0"></script>
  <script src="../../navigation.js?v=1.7.92"></script>
  <script>
  // 自检：脚本若仍是旧缓存（缺少批量编辑入口），直接红条提示，避免用户点了没反应却查不到原因
  if (typeof openBatchEditModal !== 'function') {
    var warn = document.createElement('div');
    warn.style.cssText = 'position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99999;background:#ff4d4f;color:#fff;padding:10px 18px;border-radius:8px;font:13px/1.6 -apple-system,"PingFang SC",sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.2)';
    warn.textContent = '页面加载的是旧缓存脚本，批量编辑不可用 —— 请按 Cmd + Shift + R 强制刷新';
    document.body.appendChild(warn);
  }
  </script>
</body>
</html>
