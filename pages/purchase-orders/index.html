<!doctype html>
<!-- 采购单查询区域原型 v1.2.0 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>采购单｜查询区域交互原型</title>
  <link rel="stylesheet" href="./styles.css?v=1.3.0">
</head>
<body>
  <div class="toast" id="toast">查询完成</div>
  <div class="app">
    <header class="global-bar">
      <div class="global-left"><span class="brand-shield"></span><span class="top-icon">▣</span><span class="top-icon">◉</span><span class="top-icon active">⛓</span><span class="top-icon">▥</span><span class="top-icon">▤</span><span class="top-icon">▧</span></div>
      <div class="global-right"><span class="icon">⟳</span><span class="icon">⛶</span><span class="admin">Admin⌄</span></div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div class="nav-scroll">
          <div class="nav-group-title"><span>♙</span><span>库存管理</span><span class="chev">⌃</span></div>
          <div class="nav-item"><span class="mini">▤</span>团队库存</div><div class="nav-item"><span class="mini">▥</span>平台仓&海外仓</div><div class="nav-item" style="display:none"><span class="mini">▱</span>供应商库存</div>
          <div class="nav-group-title"><span>♧</span><span>计划管理</span><span class="chev">⌃</span></div>
          <div class="nav-item"><span class="mini">▣</span>需求预测</div><div class="nav-item" data-page-nav="stock"><span class="mini">▤</span>备货计划</div><div class="nav-item" data-page-nav="purchase"><span class="mini">▥</span>采购计划</div><div class="nav-item" data-page-nav="shipment"><span class="mini">♨</span>发货计划</div>
          <div class="nav-group-title"><span>▱</span><span>供应链协同</span><span class="chev">⌃</span></div>
          <div class="nav-item active" data-page-nav="purchaseOrder"><span class="mini">▰</span>采购单</div><div class="nav-item"><span class="mini">▤</span>发货单</div>
        </div><div class="collapse">≡</div>
      </aside>
      <main class="main">
        <section class="page-head"><div class="page-tab"><span>▰</span><span>采购单</span></div></section>
        <section class="query-panel" aria-label="新增查询区域">
          <div class="query-row" id="queryRowOne">
            <div class="query-item" data-query-order="1"><input class="control po-number-input" id="purchaseOrderNo" placeholder="支持输入多个易仓、领星、中台单号"></div>
            <div class="query-item" data-query-order="2"><input class="control sku-input" id="skuInput" placeholder="请输入多个 SKU，使用逗号或空格分隔"></div>
            <div class="query-item" data-query-order="3"><div class="multi supplier-box" id="supplierMulti"><div class="multi-trigger" data-trigger>供应商（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="4"><input class="control common-input" id="planNo" placeholder="计划号，多个请用逗号或空格隔开"></div>
            <div class="query-item" data-query-order="5"><input class="control common-input" id="batchNo" placeholder="批次号，多个请用逗号或空格隔开"></div>
            <div class="query-item" data-query-order="6"><div class="multi warehouse-box" id="warehouseMulti"><div class="multi-trigger" data-trigger>采购仓库（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="7"><div class="multi platform-box" id="platformMulti"><div class="multi-trigger" data-trigger>平台（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="8"><div class="multi store-box" id="storeMulti"><div class="multi-trigger" data-trigger>店铺（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="9"><div class="multi team-box" id="teamMulti"><div class="multi-trigger" data-trigger>团队（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item" data-query-order="10"><div class="multi receiver-box" id="receiverMulti"><div class="multi-trigger" data-trigger>收货人（可多选）</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item time-query" data-query-order="11"><select class="control time-type" id="timeType"><option>收货时间</option></select><div class="date-group"><input id="startDate" type="date" aria-label="开始日期"><span>至</span><input id="endDate" type="date" aria-label="结束日期"></div></div>
            <div class="query-item" data-query-order="12"><div class="multi creator-box" id="creatorMulti"><div class="multi-trigger" data-trigger>创建人（可多选）</div><div class="dropdown" data-menu></div></div></div>
          </div>
          <div class="query-row" id="queryRowTwo"><div class="query-actions"><button class="btn primary" id="searchBtn">查询</button><button class="btn" id="resetBtn">重置</button></div></div>
          <div class="query-row advanced-query-row"></div>
          <button class="query-expand" id="queryExpand" type="button"><span class="query-arrow">⌄</span><span class="query-expand-text">展开</span></button>
        </section>
        <section class="action-strip"><div class="head-actions"><button class="btn primary">新建采购单</button><button class="btn primary">收货清单</button><button class="btn primary">采购运费分摊</button><button class="btn primary">货权调整</button></div></section>
        <section class="status-bar"><div class="status-tabs" id="statusTabs"></div><div class="status-tools"><span class="tool" title="筛选">▽</span><span class="tool" title="搜索">⌕</span><span class="tool" title="设置">⚙</span><span class="tool" title="刷新" id="refreshBtn">↻</span><span class="tool" title="下载">↧</span><span class="tool" title="文档">▧</span></div></section>
        <section class="table-area" id="tableArea"><table class="stock-table po-table"><thead><tr><th class="check"><input class="head-check" id="selectAll" type="checkbox"></th><th class="batch-col">批次号</th><th class="plan-col">计划号</th><th class="sku-col">SKU</th><th class="qty-col">采购数</th><th class="qty-col">在途数</th><th class="qty-col">到货数</th><th class="qty-col">待发数</th><th class="qty-col">收货数量&nbsp; ✎</th><th class="note-col">收货备注&nbsp; ✎</th><th class="money-col">辅料包材费</th><th class="money-col">运费</th><th class="money-col">其他费用</th></tr></thead><tbody id="tableBody"></tbody></table></section>
        <footer class="bottom-bar"><div class="bottom-left"><span class="selected-count">已选 <b id="selectedCount">0</b> 条结果</span><button class="btn soft">确认收货</button><button class="btn soft">加入货权调整</button></div><div class="bottom-right"><span>共 <b id="totalCount">27</b> 条</span><select class="control page-size" id="pageSize"><option value="25">25条/页</option><option value="10">10条/页</option><option value="50">50条/页</option></select><button class="page-btn" id="prevPage">‹</button><span id="pageButtons"></span><button class="page-btn" id="nextPage">›</button><span>前往</span><input class="control jump" id="jumpPage" value="1"><span>页</span></div></footer>
      </main>
    </div>
  </div>
  <script src="./app.js?v=1.3.0"></script>
</body>
</html>
