<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>产品列表｜产品</title>
  <link rel="stylesheet" href="../../global-export.css?v=1.0.0">
  <link rel="stylesheet" href="./styles.css?v=1.0.15">
  <link rel="stylesheet" href="../../navigation.css?v=1.7.67">
</head>
<body>
  <div class="product-page">
    <header class="product-topbar">
      <div class="global-left" aria-label="全局导航">
        <span class="brand-shield" aria-label="品牌标识"></span>
        <button class="top-icon" type="button">工作台</button>
        <button class="top-icon" type="button">财务</button>
        <button class="top-icon" type="button">供应链</button>
        <button class="top-icon" type="button">运营</button>
        <button class="top-icon active" type="button">产品</button>
      </div>
      <div class="global-right"><span class="admin">Admin⌄</span></div>
    </header>

    <div class="product-body">
      <aside class="product-sidebar">
        <div class="nav-section"><span class="nav-symbol">▦</span><span>产品管理</span><span class="nav-chevron">⌃</span></div>
        <button class="nav-item active" type="button" data-page-nav="productList"><span class="nav-symbol">▤</span><span>产品列表</span></button>
      </aside>

      <main class="product-main">
        <section class="product-query-card" aria-label="产品查询条件">
          <div class="query-row">
            <div class="code-search"><input id="keyword" placeholder="SKU、品名（中文）或型号，支持多个，用逗号或空格隔开"></div>
            <select id="category1"><option value="">一级类别（全部）</option><option>焊接设备</option><option>焊接耗材</option><option>劳保用品</option></select>
            <select id="category2"><option value="">二级类别（全部）</option><option>MIG焊机</option><option>焊接耗材</option><option>等离子切割机</option><option>面罩防护</option><option>焊接线缆</option><option>气体配件</option></select>
            <select id="productType"><option value="">产品类型（全部）</option><option>单品</option><option>组合</option></select>
            <select id="salesStatus"><option value="">销售状态（全部）</option><option>常规销售</option><option>海外仓新品</option><option>清货</option></select>
            <select id="owner"><option value="">产品负责人（全部）</option><option>Admin</option><option>张三</option><option>李四</option></select>
            <select id="logisticsType"><option value="">物流属性（全部）</option><option>普货</option><option>带电</option><option>带磁</option><option>敏感货</option></select>
            <select id="supplier"><option value="">默认供应商（全部）</option><option>深圳焊虎机电有限公司</option><option>东莞市华诚五金有限公司</option><option>宁波锐虎机械有限公司</option></select>
          </div>
          <div class="query-row query-row-bottom">
            <label class="date-field">创建时间 <input id="startDate" type="date"><span>至</span><input id="endDate" type="date"></label>
            <div class="query-actions"><button id="resetButton" class="button" type="button">重置</button><button id="searchButton" class="button primary" type="button">查询</button></div>
          </div>
        </section>

        <section class="product-actions">
          <div class="action-left"><button id="addButton" class="button primary" type="button">新增产品</button><button id="batchButton" class="button" type="button" disabled>批量编辑</button><button id="importButton" class="button" type="button">导入</button><button id="exportButton" class="button" type="button">导出</button></div>
          <button id="columnButton" class="column-button" type="button" aria-expanded="false">☷ 列设置</button>
          <div id="columnPanel" class="column-panel" hidden>
            <div class="column-panel-title">显示列</div>
            <label><input type="checkbox" data-column="logistics" checked> 物流属性</label>
            <label><input type="checkbox" data-column="supplier" checked> 默认供应商</label>
            <label><input type="checkbox" data-column="owner" checked> 产品负责人</label>
            <label><input type="checkbox" data-column="created" checked> 创建信息</label>
          </div>
        </section>

        <section class="product-table-card">
          <header class="table-header"><div><strong>产品列表</strong><span id="resultCount">共 0 条</span></div><span class="table-tip">产品以 SKU 为唯一管理对象</span></header>
          <div class="table-wrap">
            <table class="product-table">
              <thead><tr>
                <th class="select-col"><input id="selectAll" type="checkbox" aria-label="全选"></th><th>产品信息</th><th>SKU</th><th>产品类目</th><th>产品类型</th><th>销售状态</th><th>单位</th><th data-column-head="logistics">物流属性</th><th data-column-head="supplier">默认供应商</th><th data-column-head="owner">产品负责人</th><th data-column-head="created">创建信息</th><th class="operation-col">操作</th>
              </tr></thead>
              <tbody id="productTableBody"></tbody>
            </table>
          </div>
          <div id="emptyState" class="empty-state" hidden>暂无符合条件的产品</div>
          <footer class="table-footer"><span id="selectedCount">已选 0 项</span><div class="pager"><button type="button" disabled>‹</button><button class="current" type="button">1</button><button type="button">›</button></div></footer>
        </section>
      </main>
    </div>
  </div>

  <script src="./app.js?v=1.0.18"></script>
  <script src="../../global-export.js?v=1.7.37"></script>
  <script src="../../navigation.js?v=1.7.69"></script>
</body>
</html>
