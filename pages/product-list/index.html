<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>产品列表｜产品</title>
  <link rel="stylesheet" href="../../global-export.css?v=1.0.0">
  <link rel="stylesheet" href="../../global-sync.css?v=1.0.2">
  <link rel="stylesheet" href="../../custom-select.css?v=1.0.2">
  <link rel="stylesheet" href="../../ui-kit.css?v=1.0.3">
  <link rel="stylesheet" href="./styles.css?v=1.0.43">
  <link rel="stylesheet" href="../../navigation.css?v=1.7.81">
</head>
<body data-ui-kit-page="standard" class="ui-page-canvas">
  <div class="product-page ui-page-canvas">
    <header class="product-topbar">
      <div class="global-left" aria-label="全局导航">
        <span class="brand-shield" aria-label="品牌标识"></span>
        <button class="top-icon" type="button">工作台</button>
        <button class="top-icon" type="button">财务</button>
        <button class="top-icon" type="button">供应链</button>
        <button class="top-icon" type="button">运营</button>
        <button class="top-icon active" type="button">产品</button>
      </div>
      <div class="global-right"><span class="admin">Admin⌄</span></div>
    </header>

    <div class="product-body">
      <aside class="product-sidebar">
        <div class="nav-section"><span class="nav-symbol">▦</span><span>产品管理</span><span class="nav-chevron">⌃</span></div>
        <button class="nav-item active" type="button" data-page-nav="productList"><span class="nav-symbol">▤</span><span>产品列表</span></button>
        <button class="nav-item" type="button" data-page-nav="overseasSkuMapping"><span class="nav-symbol">▥</span><span>海外仓 SKU 映射</span></button>
      </aside>

      <main class="product-main">
        <section class="product-query-card ui-query-card" aria-label="产品查询条件">
          <div class="query-row ui-query-flow">
            <div class="sku-query-combo"><select id="skuSearchType" aria-label="关键字查询类型"><option value="sku">SKU</option><option value="lingxingSku">领星 SKU</option><option value="relatedSpu">关联 SPU</option><option value="model">型号</option><option value="identificationCode">识别码</option></select><input id="keyword" placeholder="请输入 SKU，支持多个，用逗号或空格隔开"></div>
            <input id="productNameQuery" class="query-text-input" placeholder="产品名称">
            <select id="category1"><option value="">一级类别（全部）</option><option>焊接设备</option><option>焊接耗材</option><option>劳保用品</option></select>
            <select id="category2"><option value="">二级类别（全部）</option><option>MIG焊机</option><option>焊接耗材</option><option>等离子切割机</option><option>面罩防护</option><option>焊接线缆</option><option>气体配件</option></select>
            <select id="productType"><option value="">产品类型（全部）</option><option>单品</option><option>组合品</option></select>
            <select id="isCombo"><option value="">是否组合品（全部）</option><option value="yes">是</option><option value="no">否</option></select>
            <div id="fitTypeMulti" class="multi ui-multi-select query-multi" aria-label="配合类型（可多选）"><button type="button" class="multi-trigger" data-trigger aria-expanded="false">配合类型（全部）</button><div class="dropdown" data-menu></div></div>
            <select id="salesStatus"><option value="">销售状态（全部）</option><option>新品</option><option>常规</option><option>在售</option><option>清仓</option><option>停售</option><option>未上市</option></select>
            <div id="logisticsMulti" class="multi ui-multi-select query-multi" aria-label="物流属性（可多选）"><button type="button" class="multi-trigger" data-trigger aria-expanded="false">物流属性（全部）</button><div class="dropdown" data-menu></div></div>
            <select id="owner" class="query-person-select"><option value="">产品负责人（全部）</option><option>Admin</option><option>张三</option><option>李四</option></select>
            <select id="enabledStatus" class="query-person-select"><option value="">启用状态（全部）</option><option value="enabled">启用</option><option value="disabled">停用</option></select>
            <select id="creator" class="query-person-select"><option value="">创建人（全部）</option><option>Admin</option><option>张三</option><option>李四</option></select>
            <select id="auditTimeType" class="audit-time-type" aria-label="时间查询类型"><option value="createdAt">创建时间</option><option value="updatedAt">更新时间</option></select>
            <div class="date-field" aria-label="时间范围"><input id="startDate" type="hidden"><button id="startDateTrigger" class="date-trigger" type="button" data-date-target="startDate"><span>开始日期</span><i aria-hidden="true">▣</i></button><em>至</em><input id="endDate" type="hidden"><button id="endDateTrigger" class="date-trigger" type="button" data-date-target="endDate"><span>结束日期</span><i aria-hidden="true">▣</i></button></div>
            <div class="query-actions ui-query-actions"><button id="searchButton" class="ui-query-button ui-query-button--primary" type="button">查询</button><button id="resetButton" class="ui-query-button" type="button">重置</button></div>
          </div>
          <div id="productDatePicker" class="product-date-picker" hidden aria-label="选择创建时间"></div>
        </section>

        <section class="product-actions">
          <div class="action-left ui-action-row"><button id="addButton" class="ui-list-action-button ui-list-action-button--primary" type="button">+新增产品</button><button id="batchButton" class="ui-list-action-button" type="button">批量编辑</button><button id="exportButton" class="ui-list-action-button" type="button">导出</button><div class="push-menu"><button id="pushButton" class="ui-list-action-button" type="button" aria-expanded="false">推送产品 <span aria-hidden="true">⌄</span></button><div id="pushMenuPanel" class="push-menu-panel" hidden role="menu"><button type="button" data-push-target="echang" role="menuitem">推送至易仓</button><button type="button" data-push-target="lingxing" role="menuitem">推送至领星</button><button type="button" data-push-target="both" role="menuitem">同时推送至易仓和领星</button></div></div><button id="pushRecordsButton" class="ui-list-action-button" type="button">推送记录</button></div>
        </section>

        <section class="product-table-card ui-list-card">
          <div class="table-wrap">
            <table class="product-table ui-table">
              <thead><tr>
                <th class="select-col"><input id="selectAll" type="checkbox" aria-label="全选"></th><th>产品信息</th><th>SKU</th><th>领星 SKU</th><th>产品类目</th><th>销售状态</th><th>单位</th><th>产品负责人</th><th>创建信息</th><th>更新信息</th><th class="operation-col">操作</th>
              </tr></thead>
              <tbody id="productTableBody"></tbody>
            </table>
          </div>
          <div id="emptyState" class="empty-state" hidden>暂无符合条件的产品</div>
          <footer class="table-footer"><span id="selectedCount">已选 0 项</span><div class="pager"><button type="button" disabled>‹</button><button class="current" type="button">1</button><button type="button">›</button></div></footer>
        </section>
      </main>
    </div>
  </div>

  <script src="../../custom-select.js?v=1.0.2"></script>
  <script src="../../ui-kit.js?v=1.0.1"></script>
  <script src="../../global-sync.js?v=1.0.3"></script>
  <script src="./app.js?v=1.0.41"></script>
  <script src="../../global-export.js?v=1.7.38"></script>
  <script src="../../navigation.js?v=1.7.81"></script>
</body>
</html>
