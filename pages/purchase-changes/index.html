<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>采购变更</title>
  <link rel="stylesheet" href="../../ui-kit.css">
  <link rel="stylesheet" href="../transfer-orders/styles.css?v=1.0.25">
  <link rel="stylesheet" href="../../document-list.css?v=1.0.1">
  <link rel="stylesheet" href="../../navigation.css?v=1.7.99">
  <link rel="stylesheet" href="../../custom-select.css?v=1.0.0">
  <link rel="stylesheet" href="./styles.css?v=1.3.0">
</head>
<body data-ui-kit-page="standard" class="ui-page-canvas">
  <div class="app">
    <header class="global-bar">
      <div class="global-left"><span class="brand-shield"></span><button class="top-icon">工作台</button><button class="top-icon" data-module="basic">基础</button><button class="top-icon">财务</button><button class="top-icon active">供应链</button><button class="top-icon">运营</button><button class="top-icon">产品</button></div>
      <div class="global-right"><span class="admin">Admin⌄</span></div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div class="nav-scroll">
          <div class="nav-group-title"><span>♙</span><span>库存管理</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="inventoryQuery">库存查询</div><div class="nav-item" data-page-nav="processingOrder">加工单</div><div class="nav-item" data-page-nav="transferOrder">调拨单</div>
          <div class="nav-group-title"><span>♧</span><span>计划管理</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="forecast">需求预测</div><div class="nav-item" data-page-nav="stock">备货计划</div><div class="nav-item" data-page-nav="purchase">采购计划</div><div class="nav-item" data-page-nav="shipment">发货计划</div>
          <div class="nav-group-title"><span>▱</span><span>供应链协同</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="purchaseOrder"><span class="mini">▰</span>采购单</div><div class="nav-item active" data-page-nav="purchaseChange"><span class="mini">▤</span>采购变更</div><div class="nav-item" data-page-nav="shipmentOrder"><span class="mini">▤</span>发货单</div><div class="nav-item" data-page-nav="skuFirstLegCost"><span class="mini">¥</span>头程费用</div>
        </div>
        <div class="collapse">≡</div>
      </aside>
      <main class="main change-main">
        <section class="query-panel ui-query-card">
          <div class="query-grid ui-query-flow">
            <div class="query-item query-combo change-no-query"><select class="control query-type-select" id="noType" aria-label="单号类型"><option value="change">变更单号</option><option value="order">采购单号</option></select><input class="control query-combo-input" id="noKeyword" placeholder="请输入单号，支持多个"></div>
            <div class="query-item"><input class="control" id="skuKeyword" placeholder="请输入 SKU 或产品名称"></div>
            <div class="query-item"><select class="control" id="supplierFilter"><option value="">供应商</option></select></div>
            <div class="query-item"><select class="control" id="fieldFilter"><option value="">变更字段</option><option>采购单价</option><option>采购数量</option><option>采购仓库</option><option>采购员</option><option>预计交货日期</option><option>结算方式</option><option>预付比例</option><option>税务信息</option><option>费用</option><option>备注</option></select></div>
            <div class="query-item"><select class="control" id="applicantFilter"><option value="">申请人</option></select></div>
            <div class="query-item query-date-item"><select class="control query-time-type" id="timeType"><option value="createdAt">申请时间</option><option value="effectiveAt">生效时间</option></select><div class="date-group"><input id="startDate" type="date" aria-label="开始日期"><span>至</span><input id="endDate" type="date" aria-label="结束日期"></div></div>
            <div class="query-item query-action-item"><div class="query-actions"><button class="btn primary" id="searchBtn">查询</button><button class="btn" id="resetBtn">重置</button></div></div>
          </div>
        </section>
        <section class="action-strip ui-action-row"><div class="head-actions" id="changeActions"></div></section>
        <section class="list-card ui-list-card">
          <section class="status-bar"><div class="status-tabs" id="statusTabs"></div></section>
          <section class="table-area">
            <table class="change-table document-list">
              <thead><tr><th class="check-col"></th><th>变更单号</th><th>状态</th><th>采购单信息</th><th>变更内容</th><th>变更前金额</th><th>变更后金额</th><th>金额变化</th><th>申请信息</th><th>审核／生效信息</th><th class="op-col">操作</th></tr></thead>
              <tbody id="changeTableBody"></tbody>
            </table>
            <div class="empty" id="changeEmpty" hidden>暂无符合条件的采购变更单</div>
          </section>
          <footer class="bottom-bar"><div class="bottom-left"><span class="sum-stats" id="changeSummary"></span></div><div class="pager"><span>共 <b id="totalCount">0</b> 张</span><select class="control page-size" id="pageSize"><option value="10">10张/页</option><option value="20">20张/页</option><option value="50">50张/页</option></select><button class="page-btn" id="prevPage">‹</button><span id="pageButtons"></span><button class="page-btn" id="nextPage">›</button></div></footer>
        </section>
      </main>
    </div>
  </div>
  <div class="change-modal" id="changeModal" hidden></div>
  <div class="toast" id="toast"></div>
  <script src="../../ui-kit.js?v=1.0.0"></script>
  <script src="./app.js?v=1.3.0"></script>
  <script src="../../custom-select.js?v=1.0.0"></script>
  <script src="../../navigation.js?v=1.7.93"></script>
</body>
</html>
