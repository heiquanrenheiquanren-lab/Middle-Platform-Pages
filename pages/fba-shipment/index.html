<!doctype html>
<!-- FBA货件 v2.2.0：一二级列表严格对齐采购计划（pages/purchase-plan-2）样式；移除 ASIN/国家，改为国家编码 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FBA货件</title>
  <link rel="stylesheet" href="../../ui-kit.css">
  <link rel="stylesheet" href="../transfer-orders/styles.css?v=1.0.24">
  <link rel="stylesheet" href="../../document-list.css?v=1.0.1">
  <link rel="stylesheet" href="../../global-export.css?v=1.0.0">
  <link rel="stylesheet" href="../../navigation.css?v=1.7.99">
  <link rel="stylesheet" href="../../custom-select.css?v=1.0.0">
  <link rel="stylesheet" href="../purchase-plan-2/column-config.css">
  <link rel="stylesheet" href="./styles.css?v=2.2.0">
</head>
<body data-ui-kit-page="standard" class="ui-page-canvas">
  <div class="toast" id="toast">查询完成</div>
  <div class="app">
    <header class="global-bar">
      <div class="global-left"><span class="brand-shield"></span><button class="top-icon">工作台</button><button class="top-icon">财务</button><button class="top-icon active">供应链</button><button class="top-icon">运营</button><button class="top-icon">产品</button><button class="top-icon">企业工单</button></div>
      <div class="global-right"><span class="admin">Admin⌄</span></div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div class="nav-scroll">
          <div class="nav-group-title"><span>♙</span><span>库存管理</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="inventoryQuery"><span class="mini">▤</span>库存查询</div><div class="nav-item" data-page-nav="processingOrder"><span class="mini">▦</span>加工单</div>
          <div class="nav-group-title"><span>♧</span><span>计划管理</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="forecast"><span class="mini">▣</span>需求预测</div><div class="nav-item" data-page-nav="stock"><span class="mini">▤</span>备货计划</div><div class="nav-item" data-page-nav="purchase"><span class="mini">▥</span>采购计划</div><div class="nav-item active" data-page-nav="fbaShipment"><span class="mini">♧</span>FBA货件</div><div class="nav-item" data-page-nav="shipment"><span class="mini">♨</span>发货计划</div>
          <div class="nav-group-title"><span>▱</span><span>供应链协同</span><span class="chev">⌃</span></div>
          <div class="nav-item" data-page-nav="purchaseOrder"><span class="mini">▰</span>采购单</div><div class="nav-item" data-page-nav="shipmentOrder"><span class="mini">▤</span>发货单</div></div><div class="collapse">≡</div>
      </aside>
      <main class="main fba-shipment-main">
        <!-- 查询卡片 -->
        <section class="query-panel ui-query-card" id="queryCard" aria-label="FBA货件查询区域">
          <div class="query-grid ui-query-flow" id="queryGrid">
            <div class="query-item query-combo query-document-combo">
              <select class="control query-type-select" id="fbaNoType" title="单号类型">
                <option value="shipmentNo">货件单号</option>
                <option value="shipmentName">货件名称</option>
                <option value="staPlanId">STA任务号</option>
                <option value="shipmentOrderNo">中台发货单号</option>
                <option value="lingxingOrderNo">领星发货单号</option>
                <option value="planNo">发货计划号</option>
                <option value="center">物流中心编码</option>
                <option value="reference">Reference ID</option>
              </select>
              <input class="control query-combo-input" id="fbaNoInput" placeholder="请输入货件单号，支持多个" autocomplete="off">
            </div>
            <div class="query-item query-combo query-document-combo">
              <select class="control query-type-select" id="fbaCodeType" title="编码类型">
                <option value="sku">SKU</option>
                <option value="msku">领星 SKU</option>
                <option value="fnsku">FNSKU</option>
              </select>
              <input class="control query-combo-input" id="fbaCodeInput" placeholder="请输入 SKU，支持多个" autocomplete="off">
            </div>
            <div class="query-item"><input class="control" id="fbaProductName" placeholder="请输入品名，支持模糊查询" autocomplete="off"></div>
            <div class="query-item"><div class="multi ui-multi-select" id="fbaCountryMulti"><div class="multi-trigger" data-trigger>请选择国家编码</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item"><div class="multi ui-multi-select" id="fbaStoreMulti"><div class="multi-trigger" data-trigger>请选择店铺</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item"><div class="multi ui-multi-select" id="fbaStatusMulti"><div class="multi-trigger" data-trigger>领星货件状态</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item">
              <select class="control" id="fbaOrderFilter" title="发货单状态">
                <option value="">发货单状态</option>
                <option value="none">未生成发货单</option>
                <option value="generated">已生成发货单</option>
                <option value="草稿">草稿</option>
                <option value="待发货">待发货</option>
                <option value="待收货">待收货</option>
                <option value="部分收货">部分收货</option>
                <option value="已完成">已完成</option>
                <option value="已作废">已作废</option>
                <option value="已取消">已取消</option>
              </select>
            </div>
            <div class="query-item">
              <select class="control" id="fbaAssociation" title="发货计划关联状态">
                <option value="">关联状态</option>
                <option value="unlinked">未关联计划</option>
                <option value="linked">已关联计划</option>
              </select>
            </div>
            <div class="query-item"><div class="multi ui-multi-select" id="fbaDiffMulti"><div class="multi-trigger" data-trigger>差异状态</div><div class="dropdown" data-menu></div></div></div>
            <div class="query-item query-date-item">
              <select class="control query-time-type" id="fbaDateType" title="时间口径">
                <option value="created">创建时间</option>
              </select>
              <div class="date-group">
                <input id="fbaStartDate" type="date" aria-label="开始日期">
                <span>至</span>
                <input id="fbaEndDate" type="date" aria-label="结束日期">
              </div>
            </div>
            <div class="query-item query-action-item">
              <div class="query-actions ui-query-actions">
                <button class="query-inline-expand" id="queryExpand" type="button" aria-expanded="false" hidden><svg class="query-arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg><span class="query-expand-text">展开</span></button>
                <button class="btn primary" id="fbaSearchBtn" type="button">查询</button>
                <button class="btn" id="fbaResetBtn" type="button">重置</button>
              </div>
            </div>
          </div>
        </section>

        <!-- 操作按钮行（32px 高，对齐采购计划） -->
        <section class="action-strip ui-action-row">
          <div class="head-actions">
            <button class="btn" id="fbaExportBtn" type="button" data-custom-export="true">导出</button>
          </div>
          <button class="column-config-trigger" id="fbaColConfigBtn" type="button" title="列配置" aria-label="列配置">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <rect x="2.5" y="3" width="15" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M7.5 3v14m5-14v14" stroke="currentColor" stroke-width="1.3"/>
            </svg>
          </button>
        </section>

        <!-- 单据列表卡片（一二级折叠列表 + 底部汇总分页，完全对齐采购计划） -->
        <section class="list-card ui-list-card">
          <section class="table-area ui-table-wrap" id="fbaTableArea">
            <table class="purchase-plan-table fba-table document-list document-list--no-check ui-table" id="fbaMainTable">
              <colgroup id="fbaColGroup">
                <col class="expand-col">
                <col class="no-col">
                <col class="fba-status-col">
                <col class="sta-col">
                <col class="store-col">
                <col class="order-col">
                <col class="qty-col">
                <col class="time-col">
              </colgroup>
              <thead>
                <tr id="fbaTableHeadRow">
                  <th>
                    <button class="document-expand expand-all" id="fbaExpandAllBtn" type="button" aria-label="展开/折叠全部" title="展开/折叠全部"></button>
                  </th>
                  <th>
                    货件单号 / 货件名称
                    <button class="copy-icon-btn copy-icon-btn-head" id="copyPageShipmentNosBtn" type="button" title="复制本页货件单号" aria-label="复制本页货件单号">
                      <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.6" height="6.6" rx="1.2"/><path d="M8 4V2.6A1.6 1.6 0 0 0 6.4 1H2.6A1.6 1.6 0 0 0 1 2.6v3.8A1.6 1.6 0 0 0 2.6 8H4"/></svg>
                    </button>
                  </th>
                  <th>领星货件状态</th>
                  <th>STA任务 / Reference ID</th>
                  <th>店铺 / 国家编码 / 物流中心</th>
                  <th>中台发货单号 / 领星发货单号</th>
                  <th>总申报量</th>
                  <th>创建时间</th>
                </tr>
              </thead>
              <tbody id="fbaTableBody"></tbody>
            </table>
          </section>
          <footer class="bottom-bar">
            <div class="bottom-summary" id="fbaSummary"></div>
            <div class="pager">
              <span>共 <b id="fbaTotalCount">0</b> 个货件</span>
              <select class="control page-size" id="fbaPageSize" title="每页条数">
                <option value="10">10条/页</option>
                <option value="20">20条/页</option>
                <option value="50">50条/页</option>
              </select>
              <button class="page-btn" id="fbaPrevPage" title="上一页" type="button">‹</button>
              <span id="fbaPageButtons"></span>
              <button class="page-btn" id="fbaNextPage" title="下一页" type="button">›</button>
            </div>
          </footer>
        </section>

        <!-- 列配置抽屉（参照采购计划列配置） -->
        <div class="fba-col-drawer-mask hidden" id="fbaColumnDrawerMask"></div>
        <aside class="fba-col-drawer hidden" id="fbaColumnDrawer" role="dialog" aria-modal="true" aria-label="列配置">
          <div class="purchase-column-config">
            <header class="purchase-column-header">
              <div class="purchase-column-title">列配置</div>
              <div class="purchase-column-tabs">
                <button type="button" class="active" data-col-tab="parent">一级列表</button>
                <button type="button" data-col-tab="child">二级列表</button>
              </div>
            </header>
            <div class="purchase-column-content">
              <div class="purchase-column-options">
                <input class="purchase-column-search" id="fbaColumnSearch" placeholder="搜索字段" aria-label="搜索字段" autocomplete="off">
                <div class="purchase-column-checks purchase-column-flat" id="fbaColumnChecks"></div>
                <div class="purchase-column-none hidden" id="fbaColumnNone">没有匹配的字段</div>
              </div>
              <div class="purchase-column-selected">
                <div class="purchase-column-selected-title">已选 <span id="fbaColumnSelectedCount">(0)</span></div>
                <p>拖动可调整列顺序</p>
                <div class="purchase-column-selected-list" id="fbaColumnSelectedList"></div>
              </div>
            </div>
            <footer class="purchase-column-footer">
              <button class="btn" id="fbaColumnRestoreBtn" type="button">恢复默认</button>
              <div>
                <button class="btn" id="fbaColumnCancelBtn" type="button">取消</button>
                <button class="btn primary" id="fbaColumnApplyBtn" type="button">保存并应用</button>
              </div>
            </footer>
          </div>
        </aside>
      </main>
    </div>
  </div>
  <script src="../../custom-select.js?v=1.0.0"></script>
  <script src="../../global-export.js?v=1.7.37"></script>
  <script src="../../navigation.js?v=1.8.02"></script>
  <script src="./app.js?v=2.3.0"></script>
</body>
</html>
