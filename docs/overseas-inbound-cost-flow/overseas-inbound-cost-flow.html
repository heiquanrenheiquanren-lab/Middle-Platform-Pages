<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>海外仓上架 · 成本入库计算流程</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eef1f6;font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;padding:28px}
  .wrap{max-width:1460px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(20,35,60,.10);overflow:hidden}
  .head{padding:26px 32px 10px}
  .head h1{margin:0;font-size:24px;color:#1b2430;letter-spacing:.2px}
  .head p{margin:8px 0 0;font-size:13px;color:#6b7887}
  .legend{display:flex;gap:18px;padding:0 32px 8px;font-size:12px;color:#6b7887;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
  svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>海外仓上架 · 成本入库计算流程</h1>
    <p>货物成本取「发货出库时点」的移动加权价；头程成本引用「上架前已分摊好」的结果</p>
  </div>
  <div class="legend">
    <span><i style="background:#1677ff"></i>① 发货出库（发货仓）</span>
    <span><i style="background:#e8833a"></i>② 头程分摊结果（上架前已完成）</span>
    <span><i style="background:#19a974"></i>③ 海外仓上架（成本入库）</span>
  </div>

  <svg viewBox="0 0 1400 980" role="img" aria-label="海外仓上架成本入库计算流程图">
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0 0 L9 4.5 L0 9 z" fill="#b8c4d4"/>
      </marker>
      <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0 0 L9 4.5 L0 9 z" fill="#8fb8ef"/>
      </marker>
    </defs>

    <!-- 顶部：发货仓 → 海外仓 -->
    <rect x="90" y="118" width="210" height="58" rx="29" fill="#f2f7ff" stroke="#c6e2ff"/>
    <text x="195" y="143" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2430">发货仓 / 中转仓</text>
    <text x="195" y="162" text-anchor="middle" font-size="11" fill="#6b7887">发货单出库时点</text>

    <rect x="1100" y="118" width="210" height="58" rx="29" fill="#eefaf4" stroke="#c8ead9"/>
    <text x="1205" y="143" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2430">海外仓</text>
    <text x="1205" y="162" text-anchor="middle" font-size="11" fill="#6b7887">上架入库时点</text>

    <line x1="300" y1="147" x2="1096" y2="147" stroke="#b8c4d4" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <rect x="596" y="128" width="204" height="24" rx="12" fill="#fff" stroke="#e3e8ef"/>
    <text x="698" y="144" text-anchor="middle" font-size="11.5" fill="#6b7887">头程物流 · 海运约 30–45 天</text>

    <!-- 列 1 -->
    <circle cx="80" cy="222" r="12" fill="#1677ff"/>
    <text x="80" y="226.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
    <text x="102" y="227" font-size="14" font-weight="600" fill="#1b2430">发货出库（锁存价格）</text>

    <rect x="70" y="252" width="380" height="64" rx="8" fill="#fff" stroke="#dfe5ee"/>
    <rect x="70" y="252" width="4" height="64" rx="2" fill="#1677ff"/>
    <text x="90" y="277" font-size="13" font-weight="600" fill="#1b2430">发货单出库</text>
    <text x="90" y="297" font-size="11.5" fill="#6b7887">发货仓库存减少，产生出库流水</text>

    <rect x="70" y="342" width="380" height="64" rx="8" fill="#fff" stroke="#dfe5ee"/>
    <rect x="70" y="342" width="4" height="64" rx="2" fill="#1677ff"/>
    <text x="90" y="367" font-size="13" font-weight="600" fill="#1b2430">锁存该时点的移动加权价 P_out</text>
    <text x="90" y="387" font-size="11.5" fill="#6b7887">之后发货仓价格再滚动，也不影响本单</text>

    <rect x="70" y="432" width="380" height="64" rx="8" fill="#fff" stroke="#dfe5ee"/>
    <rect x="70" y="432" width="4" height="64" rx="2" fill="#1677ff"/>
    <text x="90" y="457" font-size="13" font-weight="600" fill="#1b2430">记录本单发货数量 N_ship</text>
    <text x="90" y="477" font-size="11.5" fill="#6b7887">供海外仓分批上架时按批拆分</text>

    <line x1="260" y1="316" x2="260" y2="338" stroke="#b8c4d4" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="260" y1="406" x2="260" y2="428" stroke="#b8c4d4" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- 列 2 -->
    <circle cx="500" cy="222" r="12" fill="#e8833a"/>
    <text x="500" y="226.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
    <text x="522" y="227" font-size="14" font-weight="600" fill="#1b2430">头程分摊结果（上架前已完成）</text>

    <rect x="490" y="252" width="380" height="64" rx="8" fill="#fff" stroke="#dfe5ee"/>
    <rect x="490" y="252" width="4" height="64" rx="2" fill="#e8833a"/>
    <text x="510" y="277" font-size="13" font-weight="600" fill="#1b2430">头程费用在上架前完成分摊</text>
    <text x="510" y="297" font-size="11.5" fill="#6b7887">分摊方法由费用需求定义，不在本流程</text>

    <rect x="490" y="342" width="380" height="64" rx="8" fill="#fff" stroke="#dfe5ee"/>
    <rect x="490" y="342" width="4" height="64" rx="2" fill="#e8833a"/>
    <text x="510" y="367" font-size="13" font-weight="600" fill="#1b2430">形成该 SKU 的分摊结果</text>
    <text x="510" y="387" font-size="11.5" fill="#6b7887">按发货单归集，本流程只引用结果</text>

    <rect x="490" y="432" width="380" height="64" rx="8" fill="#fff" stroke="#dfe5ee"/>
    <rect x="490" y="432" width="4" height="64" rx="2" fill="#e8833a"/>
    <text x="510" y="457" font-size="13" font-weight="600" fill="#1b2430">上架时按同一发货单取到 F</text>
    <text x="510" y="477" font-size="11.5" fill="#6b7887">直接作为本次入库头程成本</text>

    <line x1="680" y1="316" x2="680" y2="338" stroke="#b8c4d4" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="680" y1="406" x2="680" y2="428" stroke="#b8c4d4" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- 列 3 -->
    <circle cx="924" cy="222" r="12" fill="#19a974"/>
    <text x="924" y="226.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <text x="946" y="227" font-size="14" font-weight="600" fill="#1b2430">海外仓上架（成本入库）</text>

    <rect x="910" y="252" width="420" height="64" rx="8" fill="#fff" stroke="#dfe5ee"/>
    <rect x="910" y="252" width="4" height="64" rx="2" fill="#19a974"/>
    <text x="930" y="277" font-size="13" font-weight="600" fill="#1b2430">海外仓上架（约 30–45 天后）</text>
    <text x="930" y="297" font-size="11.5" fill="#6b7887">同一发货单可分 X / Y 多批上架</text>

    <rect x="910" y="342" width="420" height="64" rx="8" fill="#fff" stroke="#dfe5ee"/>
    <rect x="910" y="342" width="4" height="64" rx="2" fill="#19a974"/>
    <text x="930" y="367" font-size="13" font-weight="600" fill="#1b2430">关联海外仓入库单</text>
    <text x="930" y="387" font-size="11.5" fill="#6b7887">每一批上架对应一张入库单，按批计算</text>

    <rect x="910" y="432" width="420" height="64" rx="8" fill="#fff" stroke="#dfe5ee"/>
    <rect x="910" y="432" width="4" height="64" rx="2" fill="#19a974"/>
    <text x="930" y="457" font-size="13" font-weight="600" fill="#1b2430">滚动更新成本</text>
    <text x="930" y="477" font-size="11.5" fill="#6b7887">货物、头程分别滚一次，相加为当前加权价</text>

    <line x1="1120" y1="316" x2="1120" y2="338" stroke="#b8c4d4" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="1120" y1="406" x2="1120" y2="428" stroke="#b8c4d4" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- 列间横向箭头 -->
    <line x1="452" y1="222" x2="484" y2="222" stroke="#8fb8ef" stroke-width="1.4" marker-end="url(#arrowBlue)"/>
    <line x1="872" y1="222" x2="904" y2="222" stroke="#8fb8ef" stroke-width="1.4" marker-end="url(#arrowBlue)"/>

    <!-- 公式一：货物成本 -->
    <rect x="70" y="640" width="610" height="196" rx="10" fill="#f4f8ff" stroke="#cfe0fa"/>
    <text x="94" y="672" font-size="13" font-weight="700" fill="#1677ff">货物成本 · 入库单价</text>
    <text x="94" y="700" font-size="12.5" fill="#38465a">入库单价 = 发货出库时点移动加权价</text>
    <text x="94" y="720" font-size="15" font-weight="700" fill="#1677ff" font-family="SFMono-Regular, Menlo, monospace">P_out</text>
    <text x="94" y="752" font-size="12.5" fill="#38465a">新货物加权 =（原货物成本 + 本批上架数量 × P_out）</text>
    <text x="94" y="772" font-size="12.5" fill="#38465a">　　　　　　　÷（原库存数量 + 本批上架数量）</text>
    <text x="94" y="804" font-size="11.5" fill="#8a95a5">不取上架时点价格；同一发货单多批上架共用同一个 P_out</text>

    <!-- 公式二：头程成本 -->
    <rect x="700" y="640" width="630" height="196" rx="10" fill="#fdf6ef" stroke="#f3ddc6"/>
    <text x="724" y="672" font-size="13" font-weight="700" fill="#b2651f">头程成本 · 入库成本</text>
    <text x="724" y="700" font-size="12.5" fill="#38465a">入库头程 = 同一发货单已分摊好的 F（上架时引用）</text>
    <text x="724" y="732" font-size="12.5" fill="#38465a">新头程加权 =（原头程成本 + F）</text>
    <text x="724" y="752" font-size="12.5" fill="#38465a">　　　　　　　÷（原库存数量 + 本批上架数量）</text>
    <text x="724" y="784" font-size="11.5" fill="#8a95a5">分摊规则由费用需求定义，本流程只引用结果，不重复计算</text>
    <text x="724" y="804" font-size="11.5" fill="#8a95a5">分摊结果如对应到批次，按批次分别引用</text>

    <!-- 合计 -->
    <rect x="70" y="862" width="1260" height="72" rx="10" fill="#111b2b"/>
    <text x="94" y="892" font-size="12" fill="#8fa4c2">海外仓当前移动加权平均价</text>
    <text x="94" y="916" font-size="17" font-weight="700" fill="#fff">新货物加权 + 新头程加权</text>
    <text x="1280" y="892" text-anchor="end" font-size="11.5" fill="#8fa4c2">每批上架各自滚动一次</text>
    <text x="1280" y="912" text-anchor="end" font-size="11.5" fill="#8fa4c2">同一发货单共享 P_out</text>
  </svg>
</div>
</body>
</html>
